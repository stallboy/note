<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：将军饮马（题1）。河 ℓ 为水平线 y=240；A(110,95)、B(360,130) 同侧；
     B 关于 ℓ 的对称点 B'(360,350)；AB' 交 ℓ 于 P(252,240)，AP+PB = AP+PB' ≥ AB'。
     对比点 Q(140,240)：AQ+QB 明显更长；刻度线标出 PB=PB'。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 480 360" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- 河带 -->
  <rect x="30" y="232" width="440" height="36" fill="#dbe9fb" opacity="0.55"/>
  <!-- 河岸 ℓ -->
  <line x1="40" y1="240" x2="470" y2="240" stroke="#1f3a5f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="478" y="245" fill="#1f3a5f" font-size="15" font-style="italic">ℓ</text>
  <text x="58" y="258" fill="#1f3a5f" font-size="13">河</text>

  <!-- B-B' 反射连线（竖直虚线） -->
  <line x1="360" y1="130" x2="360" y2="350" stroke="#9aa7b8" stroke-width="1.8" stroke-dasharray="5 4"/>
  <!-- A-B' 虚线（过 P） -->
  <line x1="110" y1="95" x2="360" y2="350" stroke="#9aa7b8" stroke-width="1.8" stroke-dasharray="5 4"/>

  <!-- 对比路径 A-Q-B（灰）与 Q-B'（灰虚） -->
  <polyline points="110,95 140,240 360,130" fill="none" stroke="#9aa7b8" stroke-width="2" stroke-linejoin="round"/>
  <line x1="140" y1="240" x2="360" y2="350" stroke="#c9d2dc" stroke-width="1.6" stroke-dasharray="4 4"/>
  <circle cx="140" cy="240" r="4" fill="#9aa7b8"/>
  <text x="140" y="222" text-anchor="middle" fill="#6b7280" font-size="15" font-style="italic">Q</text>
  <text x="132" y="300" fill="#6b7280" font-size="13">任取 Q：AQ+QB 更长</text>

  <!-- 最短路径 A-P-B（红） -->
  <polyline points="110,95 252,240 360,130" fill="none" stroke="#c0463a" stroke-width="3" stroke-linejoin="round"/>

  <!-- 等长刻度：PB = PB' -->
  <line x1="300.3" y1="179.4" x2="311.7" y2="190.6" stroke="#c0463a" stroke-width="2"/>
  <line x1="300.3" y1="300.6" x2="311.7" y2="289.4" stroke="#c0463a" stroke-width="2"/>

  <!-- 点与标签 -->
  <circle cx="110" cy="95" r="4.5" fill="#1f3a5f"/>
  <text x="98" y="89" text-anchor="end" fill="#1f3a5f" font-size="16" font-style="italic">A</text>
  <circle cx="360" cy="130" r="4.5" fill="#1f3a5f"/>
  <text x="370" y="126" fill="#1f3a5f" font-size="16" font-style="italic">B</text>
  <circle cx="360" cy="350" r="4.5" fill="#6b7280"/>
  <text x="370" y="354" fill="#6b7280" font-size="16">B′</text>
  <circle cx="252" cy="240" r="4.5" fill="#c0463a"/>
  <text x="252" y="222" text-anchor="middle" fill="#c0463a" font-size="16" font-style="italic">P</text>

  <!-- 标注 -->
  <text x="168" y="172" fill="#c0463a" font-size="14">AP+PB 最短</text>
  <text x="368" y="246" fill="#6b7280" font-size="12">反射</text>
</svg>
