<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：等边Δ内 3-4-5 求角（题3）。几何精确：PA=3, PB=4, ∠APB=150°，AB=√(25+12√3)；
     等边ΔABC：A(80,400) B(452.1,400) C(266.1,77.7)，内点 P(237.6,351.3)，PC=5 自动成立；
     ΔABP 绕 A 旋转 60°(B→C) 得 ΔACP'，P'(116.6,239.1)；ΔAPP' 等边(PP'=3)，P'C=PB=4，
     ΔPP'C 三边 3-4-5，∠PP'C=90°，故 ∠APB=∠AP'C=60°+90°=150°。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 460 400" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 等边 ΔABC -->
  <polygon points="80,400 452.1,400 266.1,77.7" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 旋转后的 ΔACP'（灰虚线） -->
  <polygon points="80,400 266.1,77.7 116.6,239.1" fill="none" stroke="#9aa7b8" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round"/>
  <!-- 等边 ΔAPP'（淡黄提示） -->
  <polygon points="80,400 237.6,351.3 116.6,239.1" fill="#fdf3d8" stroke="#b58900" stroke-width="1.6" stroke-dasharray="4 3" stroke-linejoin="round"/>

  <!-- P 出发的三条线 PA, PB, PC -->
  <line x1="237.6" y1="351.3" x2="80" y2="400" stroke="#1f3a5f" stroke-width="2"/>
  <line x1="237.6" y1="351.3" x2="452.1" y2="400" stroke="#1f3a5f" stroke-width="2"/>
  <line x1="237.6" y1="351.3" x2="266.1" y2="77.7" stroke="#1f3a5f" stroke-width="2"/>

  <!-- ΔPP'C 高亮（红，3-4-5 直角三角形） -->
  <polygon points="237.6,351.3 116.6,239.1 266.1,77.7" fill="#f4d9d6" fill-opacity="0.65" stroke="#c0463a" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- 直角符号 ∠PP'C（精确） -->
  <polyline points="126.9,248.6 136.4,238.4 126.1,228.8" fill="none" stroke="#c0463a" stroke-width="1.8"/>
  <text x="147" y="242" fill="#c0463a" font-size="13">90°</text>

  <!-- 旋转弧 P→P'（绕 A，60°） -->
  <path d="M237.6,351.3 A165,165 0 0 0 116.6,239.1" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
  <text x="218" y="260" fill="#6b7280" font-size="13">旋转 60°</text>

  <!-- ∠PAP'=60° 弧（A 处） -->
  <path d="M123,386.7 A45,45 0 0 0 90,356.1" fill="none" stroke="#b58900" stroke-width="1.6"/>
  <text x="118" y="352" fill="#b58900" font-size="12">60°</text>

  <!-- ∠APB=150° 弧（P 处，答案） -->
  <path d="M266.9,357.9 A30,30 0 0 0 209,360.1" fill="none" stroke="#1f3a5f" stroke-width="1.6"/>
  <text x="228" y="392" fill="#1f3a5f" font-size="13">150°</text>

  <!-- 顶点 -->
  <circle cx="80" cy="400" r="4.5" fill="#1f3a5f"/>
  <text x="68" y="418" text-anchor="end" fill="#1f3a5f" font-size="16" font-style="italic">A</text>
  <circle cx="452.1" cy="400" r="4.5" fill="#1f3a5f"/>
  <text x="464" y="418" fill="#1f3a5f" font-size="16" font-style="italic">B</text>
  <circle cx="266.1" cy="77.7" r="4.5" fill="#1f3a5f"/>
  <text x="266" y="66" text-anchor="middle" fill="#1f3a5f" font-size="16" font-style="italic">C</text>
  <circle cx="237.6" cy="351.3" r="4.5" fill="#1f3a5f"/>
  <text x="250" y="344" fill="#1f3a5f" font-size="16" font-style="italic">P</text>
  <circle cx="116.6" cy="239.1" r="4.5" fill="#c0463a"/>
  <text x="104" y="234" text-anchor="end" fill="#c0463a" font-size="16" font-style="italic">P′</text>

  <!-- 边长标注 -->
  <text x="146" y="384" fill="#1f3a5f" font-size="13">3</text>
  <text x="350" y="364" fill="#1f3a5f" font-size="13">4</text>
  <text x="262" y="212" fill="#1f3a5f" font-size="13">5</text>
  <text x="158" y="288" fill="#c0463a" font-size="13">3</text>
  <text x="196" y="150" fill="#c0463a" font-size="13">4</text>
</svg>
