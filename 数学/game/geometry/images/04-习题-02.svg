<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：仿射标准化（题2）。任意 △ABC 经唯一仿射化为标准三角形
     A(0,0), B(1,0), C(0,1)（直角顶点在原点，两直角边为坐标轴单位长）。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 640 300" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 左：任意三角形 -->
  <text x="150" y="48" text-anchor="middle" fill="#1f3a5f" font-size="13">任意三角形</text>
  <polygon points="130,80 60,260 250,235" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="130" y="70" text-anchor="middle" fill="#1f3a5f" font-size="16" font-style="italic">A</text>
  <text x="50" y="276" text-anchor="end" fill="#1f3a5f" font-size="16" font-style="italic">B</text>
  <text x="260" y="241" fill="#1f3a5f" font-size="16" font-style="italic">C</text>

  <!-- 仿射箭头 -->
  <line x1="288" y1="170" x2="368" y2="170" stroke="#374151" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="328" y="150" text-anchor="middle" fill="#374151" font-size="13" font-style="italic">仿射 T</text>
  <text x="328" y="196" text-anchor="middle" fill="#6b7280" font-size="12">存在且唯一</text>

  <!-- 右：标准三角形 + 坐标轴 -->
  <text x="505" y="48" text-anchor="middle" fill="#1f3a5f" font-size="13">标准三角形</text>
  <line x1="400" y1="260" x2="608" y2="260" stroke="#6b7280" stroke-width="1.5" marker-end="url(#axis)"/>
  <line x1="400" y1="260" x2="400" y2="62" stroke="#6b7280" stroke-width="1.5" marker-end="url(#axis)"/>
  <text x="614" y="264" fill="#6b7280" font-size="13" font-style="italic">x</text>
  <text x="406" y="56" fill="#6b7280" font-size="13" font-style="italic">y</text>
  <polygon points="410,260 540,260 410,130" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>
  <polyline points="410,248 422,248 422,260" fill="none" stroke="#6b7280" stroke-width="1.2"/>

  <circle cx="410" cy="260" r="3.5" fill="#c0463a"/>
  <circle cx="540" cy="260" r="3.5" fill="#c0463a"/>
  <circle cx="410" cy="130" r="3.5" fill="#c0463a"/>
  <text x="400" y="280" text-anchor="end" fill="#1f3a5f" font-size="13" font-style="italic">A(0,0)</text>
  <text x="540" y="282" text-anchor="middle" fill="#1f3a5f" font-size="13" font-style="italic">B(1,0)</text>
  <text x="400" y="126" text-anchor="end" fill="#1f3a5f" font-size="13" font-style="italic">C(0,1)</text>
</svg>
