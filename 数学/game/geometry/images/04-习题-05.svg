<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：重心（题5）。△ABC：A(200,80) B(60,300) C(360,300)；
     中点 M_a(210,300)、M_b(280,190)、M_c(130,190)；三中线（红虚线）共点于
     重心 G(206.7,226.7)，AG : GM_a = 2 : 1。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 400 320" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <text x="30" y="42" fill="#c0463a" font-size="13">三中线共点于重心 G</text>
  <text x="30" y="60" fill="#c0463a" font-size="13">AG : GM<tspan font-size="9" dy="2">a</tspan><tspan dy="-2"> = 2 : 1</tspan></text>

  <!-- △ABC -->
  <polygon points="200,80 60,300 360,300" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 三中线（红虚线） -->
  <line x1="200" y1="80"  x2="210" y2="300" stroke="#c0463a" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="60"  y1="300" x2="280" y2="190" stroke="#c0463a" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="360" y1="300" x2="130" y2="190" stroke="#c0463a" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- 各边中点 -->
  <circle cx="210" cy="300" r="3.5" fill="#374151"/>
  <circle cx="280" cy="190" r="3.5" fill="#374151"/>
  <circle cx="130" cy="190" r="3.5" fill="#374151"/>
  <text x="210" y="319" text-anchor="middle" fill="#374151" font-size="13" font-style="italic">M<tspan font-size="9" dy="2">a</tspan></text>
  <text x="292" y="186" fill="#374151" font-size="13" font-style="italic">M<tspan font-size="9" dy="2">b</tspan></text>
  <text x="118" y="186" text-anchor="end" fill="#374151" font-size="13" font-style="italic">M<tspan font-size="9" dy="2">c</tspan></text>

  <!-- 重心 G 与 2:1 标注 -->
  <circle cx="206.7" cy="226.7" r="5" fill="#c0463a"/>
  <text x="219" y="232" fill="#c0463a" font-size="16" font-style="italic">G</text>
  <text x="191" y="154" text-anchor="end" fill="#c0463a" font-size="12.5">2</text>
  <text x="196" y="264" text-anchor="end" fill="#c0463a" font-size="12.5">1</text>

  <text x="200" y="72" text-anchor="middle" fill="#1f3a5f" font-size="16" font-style="italic">A</text>
  <text x="52" y="316" text-anchor="end" fill="#1f3a5f" font-size="16" font-style="italic">B</text>
  <text x="368" y="316" fill="#1f3a5f" font-size="16" font-style="italic">C</text>
</svg>
