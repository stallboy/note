<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：齐次坐标的想法 —— 数轴上的点 x ↔ 过原点的光线（过 (0,0) 与 (x,1) 的直线）。
     读数线 y=1 只是一条"截口"：x = X/Y。同一条光线上的所有非零点代表同一射影点，
     故 (X:Y)=(λX:λY)。沿 x 轴的光线截口读不到 = 无穷远点 (1:0)。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="axH" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="axO" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c05621"/>
    </marker>
  </defs>

  <!-- 坐标轴（淡） -->
  <line x1="30" y1="270" x2="560" y2="270" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#axH)"/>
  <line x1="70" y1="308" x2="70" y2="45" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#axH)"/>

  <!-- 截口 y=1（读数线，深色） -->
  <line x1="95" y1="110" x2="500" y2="110" stroke="#1f3a5f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 光线束：O=(70,270) → 截口上 x=0..4，越出截口少许 -->
  <g stroke="#6b7280" stroke-width="1.6" stroke-linecap="round">
    <line x1="70" y1="270" x2="70" y2="70"/>
    <line x1="70" y1="270" x2="193" y2="62"/>
    <line x1="70" y1="270" x2="317" y2="62"/>
    <line x1="70" y1="270" x2="440" y2="62"/>
    <line x1="70" y1="270" x2="564" y2="62"/>
  </g>

  <!-- 沿 x 轴的光线（橙）：截口读不到 → 无穷远点 -->
  <line x1="70" y1="270" x2="530" y2="270" stroke="#c05621" stroke-width="2.2" marker-end="url(#axO)"/>

  <!-- x=2 那条光线上的另一代表点 (1, 0.5) -->
  <circle cx="165" cy="190" r="3.5" fill="none" stroke="#6b7280" stroke-width="1.6"/>

  <!-- 截口上的读数点 -->
  <g fill="#1f3a5f">
    <circle cx="70" cy="110" r="4.5"/>
    <circle cx="165" cy="110" r="4.5"/>
    <circle cx="260" cy="110" r="4.5"/>
    <circle cx="355" cy="110" r="4.5"/>
    <circle cx="450" cy="110" r="4.5"/>
  </g>

  <!-- 原点 -->
  <circle cx="70" cy="270" r="4.5" fill="#1f3a5f"/>

  <!-- 标签 -->
  <g font-size="15" fill="#374151">
    <text x="60" y="274" text-anchor="end">O</text>
    <text x="562" y="292">x</text>
    <text x="78" y="52">y</text>
    <text x="70" y="98" text-anchor="middle">0</text>
    <text x="165" y="98" text-anchor="middle">1</text>
    <text x="260" y="98" text-anchor="middle">2</text>
    <text x="355" y="98" text-anchor="middle">3</text>
    <text x="450" y="98" text-anchor="middle">4</text>
    <text x="512" y="104">截口 y=1</text>
  </g>
  <rect x="176" y="170" width="340" height="46" fill="#ffffff" opacity="0.88"/>
  <g font-size="13" fill="#6b7280">
    <text x="182" y="186">同一光线上的点代表同一射影点：</text>
    <text x="182" y="204">(1 : 0.5) = (2 : 1) = (4 : 2)…，读数都是 x = X/Y = 2</text>
  </g>
  <g font-size="13" fill="#c05621">
    <text x="300" y="294" text-anchor="middle">沿 x 轴的光线：截口永远读不到它 = 无穷远点 (1 : 0)</text>
  </g>

  <!-- 标题 -->
  <text x="36" y="30" font-size="15" fill="#374151">数轴上的点 x　⟷　过原点的一束光线</text>
</svg>
