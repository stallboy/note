<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：伯恩赛德引理示例——3 颗珠子 2 种颜色的手链
     8 种染色在 D₃（3 旋转 + 3 反射）下去重，恰剩 4 种：
     全黑、全白、一黑二白、二黑一白。
     每图：正三角形（浅灰边）三顶点各一颗珠子（r=14）；黑珠 #1f3a5f 实心，白珠白底蓝边。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 205" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <text x="350" y="30" text-anchor="middle" fill="#374151" font-size="15">8 种染色，旋转 / 翻转（D₃）去重 → 4 种手链</text>

  <!-- ===== 1：全黑 ===== -->
  <polygon points="100,70 52,150 148,150" fill="none" stroke="#9aa7b8" stroke-width="1.6"/>
  <circle cx="100" cy="70" r="14" fill="#1f3a5f"/>
  <circle cx="52" cy="150" r="14" fill="#1f3a5f"/>
  <circle cx="148" cy="150" r="14" fill="#1f3a5f"/>
  <text x="100" y="192" text-anchor="middle" fill="#374151" font-size="14">全黑</text>

  <!-- ===== 2：全白 ===== -->
  <polygon points="265,70 217,150 313,150" fill="none" stroke="#9aa7b8" stroke-width="1.6"/>
  <circle cx="265" cy="70" r="14" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <circle cx="217" cy="150" r="14" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <circle cx="313" cy="150" r="14" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <text x="265" y="192" text-anchor="middle" fill="#374151" font-size="14">全白</text>

  <!-- ===== 3：一黑二白 ===== -->
  <polygon points="430,70 382,150 478,150" fill="none" stroke="#9aa7b8" stroke-width="1.6"/>
  <circle cx="430" cy="70" r="14" fill="#1f3a5f"/>
  <circle cx="382" cy="150" r="14" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <circle cx="478" cy="150" r="14" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <text x="430" y="192" text-anchor="middle" fill="#374151" font-size="14">一黑二白</text>

  <!-- ===== 4：二黑一白 ===== -->
  <polygon points="595,70 547,150 643,150" fill="none" stroke="#9aa7b8" stroke-width="1.6"/>
  <circle cx="595" cy="70" r="14" fill="#1f3a5f"/>
  <circle cx="547" cy="150" r="14" fill="#1f3a5f"/>
  <circle cx="643" cy="150" r="14" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <text x="595" y="192" text-anchor="middle" fill="#374151" font-size="14">二黑一白</text>
</svg>
