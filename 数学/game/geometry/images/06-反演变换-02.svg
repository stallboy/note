<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：单位圆反演把直线 x=2 变成过 O 的圆（圆心 1/4，半径 1/4）。
     灰色单位圆 Γ 为反演参照；蓝线 x=2 为原像；填充小圆为像；箭头指示对应关系。
     坐标按反演几何精确计算（O=(150,230)，单位长 120px）；文字为真 <text>。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 85 445 295" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 反演圆 Γ（参照系）：单位圆，圆心 O，半径 1 -->
  <circle cx="150" cy="230" r="120" fill="none" stroke="#9aa7b8" stroke-width="2.5"/>
  <text x="95" y="150" text-anchor="middle" fill="#6b7280" font-size="14">单位圆 Γ</text>

  <!-- 原像：直线 x = 2（不过 O） -->
  <line x1="390" y1="146" x2="390" y2="314" stroke="#1f3a5f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="390" y="120" text-anchor="middle" fill="#374151" font-size="15">直线 x = 2</text>

  <!-- 像：反演后得到的圆，圆心 (1/4, 0)、半径 1/4，过 O -->
  <circle cx="180" cy="230" r="30" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5"/>

  <!-- 指示箭头：从“像”标注指向像圆 -->
  <line x1="288" y1="180" x2="204" y2="211" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="312" y="170" text-anchor="middle" fill="#374151" font-size="15">像</text>

  <!-- 反演中心 O -->
  <circle cx="150" cy="230" r="2.8" fill="#374151"/>
  <text x="142" y="248" text-anchor="end" fill="#374151" font-size="15">O</text>
</svg>
