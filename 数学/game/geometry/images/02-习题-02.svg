<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：正方形 ∠EAF=45°（题2）。A(110,80) B(350,80) C(350,320) D(110,320)；
     E(350,144)∈BC, F(249,320)∈CD, ∠EAF=45°；ΔABE 绕 A 逆时针 90°(B→D) 到 ΔADG，G(46,320)∈DC 延长线；
     ΔAEF≅ΔAGF(SAS) ⟹ EF=GF=GD+DF=BE+DF。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 40 430 320" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 旋转后的 ΔADG（淡红，虚线） -->
  <polygon points="110,80 110,320 46,320" fill="#f4d9d6" stroke="#c0463a" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>
  <!-- 原 ΔABE（淡蓝） -->
  <polygon points="110,80 350,80 350,144" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- 正方形框 -->
  <polygon points="110,80 350,80 350,320 110,320" fill="none" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 关键线段 -->
  <line x1="110" y1="80" x2="350" y2="144" stroke="#1f3a5f" stroke-width="2.2"/>
  <line x1="110" y1="80" x2="249" y2="320" stroke="#1f3a5f" stroke-width="2.2"/>
  <line x1="110" y1="80" x2="46" y2="320" stroke="#c0463a" stroke-width="2.2" stroke-dasharray="6 4"/>
  <line x1="350" y1="144" x2="249" y2="320" stroke="#c0463a" stroke-width="2.6"/>
  <line x1="249" y1="320" x2="46" y2="320" stroke="#c0463a" stroke-width="2.2" stroke-dasharray="6 4"/>

  <!-- 旋转弧 B→D（绕 A，90°） -->
  <path d="M150,80 A40,40 0 0 1 110,120" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
  <text x="158" y="116" fill="#6b7280" font-size="13">旋转 90°</text>

  <!-- ∠EAF=45° 标注（AE 方向 14.9° 到 AF 方向 59.9°） -->
  <path d="M148.6,90.3 A40,40 0 0 1 130.1,114.6" fill="none" stroke="#1f3a5f" stroke-width="1.6"/>
  <text x="156" y="104" fill="#1f3a5f" font-size="13">45°</text>

  <!-- 顶点标签 -->
  <text x="102" y="74" text-anchor="end" fill="#1f3a5f" font-size="15" font-style="italic">A</text>
  <text x="356" y="74" fill="#1f3a5f" font-size="15" font-style="italic">B</text>
  <text x="356" y="334" fill="#1f3a5f" font-size="15" font-style="italic">C</text>
  <text x="102" y="334" text-anchor="end" fill="#1f3a5f" font-size="15" font-style="italic">D</text>
  <text x="358" y="140" fill="#1f3a5f" font-size="15" font-style="italic">E</text>
  <text x="252" y="336" fill="#1f3a5f" font-size="15" font-style="italic">F</text>
  <text x="38" y="336" text-anchor="end" fill="#c0463a" font-size="15" font-style="italic">G</text>

  <text x="150" y="300" fill="#c0463a" font-size="13">EF = BE + DF</text>
</svg>
