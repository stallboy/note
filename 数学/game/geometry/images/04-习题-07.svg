<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：主轴定理实战（题7）。M=((2,1),(1,2)) 把单位圆映成椭圆。
     左：单位圆(圆心(150,180), r=95)，两虚线为主轴方向 y=±x，
         红点为该方向上的单位点 (150±67.2, 180∓67.2)。
     右：椭圆 = 圆沿两垂直主轴拉伸 ×3、×1：
         长半轴 135px 沿屏幕方向 (1,−1)/√2，短半轴 45px 沿 (1,1)/√2，
         顶点 (615.5,84.5) (424.5,275.5) 与 (551.8,211.8) (488.2,148.2)。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 700 320" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <defs>
    <marker id="arr7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 左：单位圆 + 主轴方向 -->
  <circle cx="150" cy="180" r="95" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5"/>
  <line x1="68.7" y1="261.3" x2="231.3" y2="98.7" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="68.7" y1="98.7" x2="231.3" y2="261.3" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="217.2" cy="112.8" r="4" fill="#c0463a"/>
  <circle cx="217.2" cy="247.2" r="4" fill="#c0463a"/>
  <text x="150" y="58" text-anchor="middle" fill="#1f3a5f" font-size="13">单位圆 x² + y² = 1</text>
  <text x="237" y="100" fill="#6b7280" font-size="11.5" font-style="italic">y = x</text>
  <text x="237" y="266" fill="#6b7280" font-size="11.5" font-style="italic">y = −x</text>

  <!-- 变换箭头 -->
  <line x1="278" y1="180" x2="352" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#arr7)"/>
  <text x="315" y="162" text-anchor="middle" fill="#374151" font-size="14" font-style="italic">M</text>
  <text x="315" y="206" text-anchor="middle" fill="#6b7280" font-size="12">沿主轴拉伸 ×3、×1</text>

  <!-- 右：椭圆 + 主轴 -->
  <line x1="415.3" y1="284.7" x2="624.7" y2="75.3" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="474.7" y1="134.7" x2="565.3" y2="225.3" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <ellipse cx="520" cy="180" rx="135" ry="45" transform="rotate(-45 520 180)"
           fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5"/>
  <circle cx="615.5" cy="84.5" r="4" fill="#c0463a"/>
  <circle cx="424.5" cy="275.5" r="4" fill="#c0463a"/>
  <circle cx="551.8" cy="211.8" r="4" fill="#c0463a"/>
  <circle cx="488.2" cy="148.2" r="4" fill="#c0463a"/>
  <text x="630" y="72" fill="#c0463a" font-size="12.5">半轴 3</text>
  <text x="572" y="238" fill="#c0463a" font-size="12.5">半轴 1</text>
  <text x="520" y="58" text-anchor="middle" fill="#1f3a5f" font-size="13">椭圆 5u² − 8uv + 5v² = 9</text>
  <text x="520" y="312" text-anchor="middle" fill="#6b7280" font-size="12.5">面积 = π·3·1 = 3π</text>
</svg>
