<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：分式线性变换的几何分解（实例 M = [[1,1],[1/2,1]]，x ↦ (x+1)/(x/2+1)）。
     ① 矩阵步 = 整个平面的线性运动：截口 ℓ: y=1 被搬到新直线 ℓ″（过 (b,d)=(1,1)，方向 (a,c)=(1,1/2)）；
     ② 按 X/Y 读数 = 从原点把 ℓ″ 中心投影回 y=1，读数依次为 1, 4/3, 3/2, 8/5（精确计算）。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 560 350" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="axG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- 坐标轴（淡） -->
  <line x1="30" y1="330" x2="545" y2="330" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#axG)"/>
  <line x1="80" y1="356" x2="80" y2="40" stroke="#9ca3af" stroke-width="1.3" marker-end="url(#axG)"/>

  <!-- ② 读数射线（从原点过 ℓ″ 上像点，投回 y=1）：先画在底层 -->
  <g stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round">
    <line x1="80" y1="330" x2="170" y2="210"/>
    <line x1="80" y1="330" x2="260" y2="150"/>
    <line x1="80" y1="330" x2="350" y2="90"/>
    <line x1="80" y1="330" x2="440" y2="30"/>
  </g>

  <!-- ① 线性运动的搬运痕迹（绿点线）：(x,1) → (x+1, x/2+1) -->
  <g stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round">
    <line x1="170" y1="210" x2="260" y2="150"/>
    <line x1="260" y1="210" x2="350" y2="90"/>
    <line x1="350" y1="210" x2="440" y2="30"/>
  </g>

  <!-- 直线 ℓ: y=1（深） -->
  <line x1="60" y1="210" x2="470" y2="210" stroke="#1f3a5f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 直线 ℓ″ = M(ℓ)（绿） -->
  <line x1="170" y1="210" x2="440" y2="30" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ℓ 上原点 x=0..3 -->
  <g fill="#1f3a5f">
    <circle cx="80" cy="210" r="4.5"/>
    <circle cx="170" cy="210" r="4.5"/>
    <circle cx="260" cy="210" r="4.5"/>
    <circle cx="350" cy="210" r="4.5"/>
  </g>

  <!-- ℓ″ 上像点（绿） -->
  <g fill="#16a34a">
    <circle cx="170" cy="210" r="4.5"/>
    <circle cx="260" cy="150" r="4.5"/>
    <circle cx="350" cy="90" r="4.5"/>
    <circle cx="440" cy="30" r="4.5"/>
  </g>

  <!-- 读回 y=1 的最终像（蓝）：x′ = (x+1)/(x/2+1) = 1, 4/3, 3/2, 8/5 -->
  <g fill="#3b82f6">
    <circle cx="200" cy="210" r="4.5"/>
    <circle cx="215" cy="210" r="4.5"/>
    <circle cx="224" cy="210" r="4.5"/>
  </g>

  <!-- 读数引导小刻度 -->
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="170" y1="214" x2="170" y2="226"/>
    <line x1="200" y1="214" x2="200" y2="240"/>
    <line x1="215" y1="214" x2="215" y2="226"/>
    <line x1="224" y1="214" x2="224" y2="240"/>
  </g>

  <!-- 原点 -->
  <circle cx="80" cy="330" r="4.5" fill="#1f3a5f"/>

  <!-- 标签 -->
  <g font-size="15" fill="#374151">
    <text x="70" y="334" text-anchor="end">O</text>
    <text x="545" y="352">x</text>
    <text x="90" y="46">y</text>
    <text x="80" y="198" text-anchor="middle">0</text>
    <text x="150" y="196" text-anchor="middle">1</text>
    <text x="245" y="198" text-anchor="middle">2</text>
    <text x="330" y="198" text-anchor="middle">3</text>
    <text x="62" y="180">ℓ: y=1</text>
  </g>
  <g font-size="14" fill="#15803d">
    <text x="268" y="148">(2, 1.5)</text>
    <text x="358" y="88">(3, 2)</text>
    <text x="448" y="28">(4, 2.5)</text>
    <text x="396" y="52">ℓ″ = M(ℓ)</text>
  </g>
  <g font-size="13" fill="#1d4ed8">
    <text x="170" y="238" text-anchor="middle">1</text>
    <text x="200" y="254" text-anchor="middle">4/3</text>
    <text x="215" y="238" text-anchor="middle">3/2</text>
    <text x="228" y="254" text-anchor="middle">8/5</text>
  </g>
</svg>
