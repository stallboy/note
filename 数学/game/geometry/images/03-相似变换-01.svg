<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：正向相似变换 z ↦ (1+i)z + 2 把蓝色 △ABC 映成红色 △A'B'C'。
     (1+i)=√2·e^(iπ/4)：放缩 √2、逆时针旋转 45°、再平移 2。
     逐点验证：A(1,0)→3+i=A'；B(2,0)→4+2i=B'；C(1,1)→(1+i)²+2=2+2i=C'。
     坐标按几何精确换算（1 单位 = 60px，原点 O=(80,232)）；文字为真 <text>，非路径。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 5 400 280" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrAx" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7b8"/>
    </marker>
  </defs>

  <!-- ===== 坐标轴 ===== -->
  <line x1="50" y1="232" x2="380" y2="232" stroke="#9aa7b8" stroke-width="1.8" marker-end="url(#arrAx)"/>
  <text x="388" y="237" fill="#6b7280" font-size="15" font-style="italic">x</text>
  <line x1="80" y1="262" x2="80"  y2="40"  stroke="#9aa7b8" stroke-width="1.8" marker-end="url(#arrAx)"/>
  <text x="80" y="32" text-anchor="middle" fill="#6b7280" font-size="15" font-style="italic">y</text>
  <text x="74" y="247" text-anchor="end" fill="#6b7280" font-size="13">O</text>

  <!-- ===== 原图 △ABC（蓝）：A(1,0) B(2,0) C(1,1)，直角在 A ===== -->
  <polygon points="140,232 200,232 140,172" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="140" cy="232" r="2.8" fill="#1f3a5f"/>
  <circle cx="200" cy="232" r="2.8" fill="#1f3a5f"/>
  <circle cx="140" cy="172" r="2.8" fill="#1f3a5f"/>
  <text x="148" y="249" fill="#374151" font-size="15" font-style="italic">A</text>
  <text x="200" y="251" text-anchor="middle" fill="#374151" font-size="15" font-style="italic">B</text>
  <text x="132" y="170" text-anchor="end" fill="#374151" font-size="15" font-style="italic">C</text>
  <text x="170" y="252" text-anchor="middle" fill="#1f3a5f" font-size="14" font-style="italic">ABC</text>

  <!-- ===== 像 △A'B'C'（红）：A'(3,1) B'(4,2) C'(2,2) ===== -->
  <polygon points="260,172 320,112 200,112" fill="#f6dcd6" stroke="#a83a2c" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="260" cy="172" r="2.8" fill="#a83a2c"/>
  <circle cx="320" cy="112" r="2.8" fill="#a83a2c"/>
  <circle cx="200" cy="112" r="2.8" fill="#a83a2c"/>
  <text x="268" y="189" fill="#374151" font-size="15" font-style="italic">A′</text>
  <text x="328" y="116" fill="#374151" font-size="15" font-style="italic">B′</text>
  <text x="192" y="110" text-anchor="end" fill="#374151" font-size="15" font-style="italic">C′</text>
  <text x="260" y="144" text-anchor="middle" fill="#a83a2c" font-size="14" font-style="italic">A′B′C′</text>

  <!-- ===== 变换公式 ===== -->
  <text x="130" y="72" fill="#374151" font-size="16">
    <tspan font-style="italic">z</tspan> ↦ (1 + <tspan font-style="italic">i</tspan>)<tspan font-style="italic">z</tspan> + 2
  </text>

  <!-- ===== 变换分解说明（小注） ===== -->
  <text x="288" y="208" text-anchor="middle" fill="#6b7280" font-size="13">放缩 √2，旋转 45°，平移 2</text>
</svg>
