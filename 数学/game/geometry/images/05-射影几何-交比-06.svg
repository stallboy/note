<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：调和点列——交比 -1。
     数轴上 A=0, B=1（基准对，蓝），D=3/5 内分、C=3 外分（插入对，橙），
     分割率都是 3:2，互为镜像；右端标出"中点 ↔ 无穷远"这一对极限情形。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 580 300" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 数轴：x_px = 80 + 110x，范围 -0.5 ~ 4.2 -->
  <line x1="25" y1="220" x2="542" y2="220" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- 基准对 A,B（蓝） -->
  <circle cx="80" cy="220" r="5" fill="#1f3a5f"/>
  <circle cx="190" cy="220" r="5" fill="#1f3a5f"/>
  <text x="80" y="248" text-anchor="middle" fill="#1f3a5f" font-size="15">A=0</text>
  <text x="190" y="248" text-anchor="middle" fill="#1f3a5f" font-size="15">B=1</text>

  <!-- 插入对 D,C（橙）：D=3/5 内分，C=3 外分 -->
  <circle cx="146" cy="220" r="5" fill="#c05621"/>
  <circle cx="410" cy="220" r="5" fill="#c05621"/>
  <text x="146" y="248" text-anchor="middle" fill="#c05621" font-size="15">D=3/5</text>
  <text x="410" y="248" text-anchor="middle" fill="#c05621" font-size="15">C=3</text>

  <!-- 内分割标注（下方）：AD:DB = 3:2 -->
  <g stroke="#9aa7b8" stroke-width="1.4" fill="none">
    <line x1="80" y1="268" x2="146" y2="268"/>
    <line x1="146" y1="268" x2="190" y2="268"/>
  </g>
  <text x="113" y="262" text-anchor="middle" fill="#6b7280" font-size="13">3</text>
  <text x="168" y="262" text-anchor="middle" fill="#6b7280" font-size="13">2</text>
  <text x="135" y="292" text-anchor="middle" fill="#6b7280" font-size="13">D 内分 AB 成 3:2</text>

  <!-- 外分割标注（上方）：AC:CB = 3:2 -->
  <g stroke="#9aa7b8" stroke-width="1.4" fill="none">
    <line x1="80" y1="176" x2="410" y2="176"/>
    <line x1="190" y1="158" x2="410" y2="158"/>
  </g>
  <text x="245" y="170" text-anchor="middle" fill="#6b7280" font-size="13">3</text>
  <text x="300" y="152" text-anchor="middle" fill="#6b7280" font-size="13">2</text>
  <text x="245" y="140" text-anchor="middle" fill="#6b7280" font-size="13">C 外分 AB 成 3:2</text>

  <!-- 中点标记（灰）：M=1/2 与无穷远配对 -->
  <circle cx="135" cy="220" r="3" fill="none" stroke="#6b7280" stroke-width="1.6"/>
  <text x="120" y="204" text-anchor="end" fill="#6b7280" font-size="12">中点 M=1/2</text>

  <!-- 无穷远注记 -->
  <text x="500" y="204" text-anchor="middle" fill="#6b7280" font-size="13">∞</text>
  <line x1="442" y1="210" x2="488" y2="206" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="470" y="192" text-anchor="middle" fill="#6b7280" font-size="12">中点的搭档</text>

  <!-- 结论 -->
  <text x="290" y="330" text-anchor="middle" fill="#374151" font-size="16">(A, B; C, D) = (3/2) / (−3/2) = −1：内分与外分镜像配对</text>
</svg>
