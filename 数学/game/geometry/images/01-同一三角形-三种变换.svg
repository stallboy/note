<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：同一三角形的 原图 / 平移 / 旋转 / 反射
     坐标按几何关系精确计算；文字为真 <text>，清晰锐利、易改。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 共同基底三角形(局部): (0,0)(160,0)(48,-112) —— 底边水平、顶点偏左 -->

  <!-- ===== 原图：标准位 ===== -->
  <g>
    <polygon points="100,160 260,160 148,48" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="180" y="188" text-anchor="middle" fill="#374151" font-size="16">原图</text>
  </g>

  <!-- ===== 平移：虚线原位 + 平移后(右30上20) + 位移箭头 ===== -->
  <g>
    <polygon points="420,160 580,160 468,48" fill="none" stroke="#9aa7b8" stroke-width="1.8" stroke-dasharray="5 4"/>
    <polygon points="450,140 610,140 498,28" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="424" y1="156" x2="452" y2="138" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arr)"/>
    <text x="540" y="195" text-anchor="middle" fill="#374151" font-size="16">平移</text>
  </g>

  <!-- ===== 旋转：虚线原位 + 绕重心(169.3,287.7)逆时针35° + 旋转弧 ===== -->
  <g>
    <polygon points="100,325 260,325 148,213" fill="none" stroke="#9aa7b8" stroke-width="1.8" stroke-dasharray="5 4"/>
    <polygon points="133.9,358 265,266.2 109,238.7" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="169.3" cy="287.7" r="2.2" fill="#6b7280"/>
    <path d="M193,288 A24,24 0 0 0 188.7,274.2" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="206" y="280" fill="#6b7280" font-size="13">35°</text>
    <text x="180" y="400" text-anchor="middle" fill="#374151" font-size="16">旋转</text>
  </g>

  <!-- ===== 反射：虚线原位 + 关于竖轴 x=540 翻转 + 对称轴 ===== -->
  <g>
    <polygon points="460,325 620,325 508,213" fill="none" stroke="#9aa7b8" stroke-width="1.8" stroke-dasharray="5 4"/>
    <polygon points="620,325 460,325 572,213" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="540" y1="325" x2="540" y2="195" stroke="#9aa7b8" stroke-width="1.8" stroke-dasharray="4 4"/>
    <text x="540" y="400" text-anchor="middle" fill="#374151" font-size="16">反射</text>
  </g>
</svg>
