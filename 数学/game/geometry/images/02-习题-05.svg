<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：法格纳诺定理（题5）。锐角 ΔABC：A(250,60) B(70,330) C(430,330)；
     垂足 D(250,330)(A→BC), E(319,164)(B→AC), F(181,164)(C→AB)，三者均精确垂直(点积=0)；
     垂足 ΔDEF(红) 是周长最短的内接三角形；三条高线虚线。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 460 350" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <!-- 锐角 ΔABC -->
  <polygon points="250,60 70,330 430,330" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 三条高（虚线灰）：AD, BE, CF -->
  <line x1="250" y1="60"  x2="250" y2="330" stroke="#9aa7b8" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="70"  y1="330" x2="319" y2="164" stroke="#9aa7b8" stroke-width="1.8" stroke-dasharray="5 4"/>
  <line x1="430" y1="330" x2="181" y2="164" stroke="#9aa7b8" stroke-width="1.8" stroke-dasharray="5 4"/>

  <!-- 垂足 ΔDEF（红高亮） -->
  <polygon points="250,330 319,164 181,164" fill="#f4d9d6" stroke="#c0463a" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- 直角符号：D(AD⊥BC 水平)、E(BE⊥AC)、F(CF⊥AB) -->
  <path d="M250,318 L238,318 L238,330" fill="none" stroke="#374151" stroke-width="1.4"/>
  <path d="M311,170 L316,179 L307,184" fill="none" stroke="#374151" stroke-width="1.4"/>
  <path d="M189,170 L184,179 L193,184" fill="none" stroke="#374151" stroke-width="1.4"/>

  <!-- 顶点 -->
  <circle cx="250" cy="60"  r="4.5" fill="#1f3a5f"/>
  <text x="250" y="48" text-anchor="middle" fill="#1f3a5f" font-size="16" font-style="italic">A</text>
  <circle cx="70"  cy="330" r="4.5" fill="#1f3a5f"/>
  <text x="58" y="348" text-anchor="end" fill="#1f3a5f" font-size="16" font-style="italic">B</text>
  <circle cx="430" cy="330" r="4.5" fill="#1f3a5f"/>
  <text x="442" y="348" fill="#1f3a5f" font-size="16" font-style="italic">C</text>

  <!-- 垂足 -->
  <circle cx="250" cy="330" r="4" fill="#c0463a"/>
  <text x="250" y="348" text-anchor="middle" fill="#c0463a" font-size="15" font-style="italic">D</text>
  <circle cx="319" cy="164" r="4" fill="#c0463a"/>
  <text x="332" y="160" fill="#c0463a" font-size="15" font-style="italic">E</text>
  <circle cx="181" cy="164" r="4" fill="#c0463a"/>
  <text x="168" y="160" text-anchor="end" fill="#c0463a" font-size="15" font-style="italic">F</text>

  <text x="248" y="252" text-anchor="middle" fill="#c0463a" font-size="13">垂足三角形</text>
  <text x="248" y="270" text-anchor="middle" fill="#c0463a" font-size="13">周长最短</text>
</svg>
