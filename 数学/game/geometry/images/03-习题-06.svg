<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 390" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <!-- 外接圆与共圆四边形 ABCD -->
  <circle cx="200.0" cy="195.0" r="105.0" fill="none" stroke="#9aa7b8" stroke-width="1.6"/>
  <polygon points="96.6,213.2 147.5,104.1 267.5,114.6 301.4,222.2" fill="none" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 对角线 -->
  <line x1="96.6" y1="213.2" x2="267.5" y2="114.6" stroke="#1f3a5f" stroke-width="1.6"/>
  <line x1="147.5" y1="104.1" x2="301.4" y2="222.2" stroke="#1f3a5f" stroke-width="1.6"/>

  <!-- 构造点 E 与 AE -->
  <line x1="96.6" y1="213.2" x2="202.1" y2="146.0" stroke="#b45309" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="202.1" cy="146.0" r="3" fill="#b45309"/>

  <!-- 顶点 -->
  <circle cx="96.6" cy="213.2" r="2.8" fill="#1f3a5f"/>
  <circle cx="147.5" cy="104.1" r="2.8" fill="#1f3a5f"/>
  <circle cx="267.5" cy="114.6" r="2.8" fill="#1f3a5f"/>
  <circle cx="301.4" cy="222.2" r="2.8" fill="#1f3a5f"/>
  <text x="82.6" y="229.2" fill="#374151" font-size="16" font-style="italic">A</text>
  <text x="143.5" y="94.1" fill="#374151" font-size="16" font-style="italic">B</text>
  <text x="277.5" y="110.6" fill="#374151" font-size="16" font-style="italic">C</text>
  <text x="313.4" y="236.2" fill="#374151" font-size="16" font-style="italic">D</text>
  <text x="212.1" y="140.0" fill="#b45309" font-size="15" font-style="italic">E</text>

  <!-- 注记 -->
  <text x="200" y="372" text-anchor="middle" fill="#374151" font-size="13.5">构造 E 使 △ACD ∽ △ABE；共圆 ⟺ E 落在 BD 上</text>
</svg>
