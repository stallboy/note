<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 390 350" text-rendering="geometricPrecision" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<!-- 题6 托勒密不等式（一般四边形，不共圆）。σ 绕 A 把 C→B，E=σ(D)：
     △ACD（蓝）∽ △ABE（橙），BD ≤ BE + DE（橙色折线）；等号 ⟺ E 落在 BD 上 ⟺ 共圆。
     本图：BE+DE−BD = 16.3 > 0。A 处两段弧为同一旋转角（∠CAB = ∠DAE）。 -->
<polygon points="80.0,240.0 280.0,100.0 250.0,180.0" fill="#dbe9fb" fill-opacity="0.55"/>
<polygon points="80.0,240.0 130.0,90.0 145.3,143.2" fill="#b45309" fill-opacity="0.14"/>
<line x1="80" y1="240" x2="130" y2="90" stroke="#1f3a5f" stroke-width="2.5"/>
<line x1="130" y1="90" x2="280" y2="100" stroke="#1f3a5f" stroke-width="2.5"/>
<line x1="280" y1="100" x2="250" y2="180" stroke="#1f3a5f" stroke-width="2.5"/>
<line x1="250" y1="180" x2="80" y2="240" stroke="#1f3a5f" stroke-width="2.5"/>
<line x1="80" y1="240" x2="280" y2="100" stroke="#1f3a5f" stroke-width="1.5"/>
<line x1="130" y1="90" x2="250" y2="180" stroke="#1f3a5f" stroke-width="1.5"/>
<line x1="80" y1="240" x2="145.3" y2="143.2" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4"/>
<polyline points="130.0,90.0 145.3,143.2 250.0,180.0" fill="none" stroke="#b45309" stroke-width="2.6" stroke-linejoin="round"/>
<path d="M107.9,220.5 A34,34 0 0 0 90.8,207.7" fill="none" stroke="#b45309" stroke-width="1.5"/>
<path d="M101.7,232.3 A23,23 0 0 0 92.9,220.9" fill="none" stroke="#b45309" stroke-width="1.5"/>
<circle cx="80" cy="240" r="3.2" fill="#1f3a5f"/>
<text x="72" y="254" text-anchor="end" fill="#374151" font-size="16" font-style="italic">A</text>
<circle cx="130" cy="90" r="3.2" fill="#1f3a5f"/>
<text x="130" y="80" text-anchor="middle" fill="#374151" font-size="16" font-style="italic">B</text>
<circle cx="280" cy="100" r="3.2" fill="#1f3a5f"/>
<text x="288" y="96" text-anchor="start" fill="#374151" font-size="16" font-style="italic">C</text>
<circle cx="250" cy="180" r="3.2" fill="#1f3a5f"/>
<text x="260" y="190" text-anchor="start" fill="#374151" font-size="16" font-style="italic">D</text>
<circle cx="145.3" cy="143.2" r="3.6" fill="#b45309"/>
<text x="136.3" y="140.2" text-anchor="end" fill="#b45309" font-size="15" font-style="italic">E</text>
<text x="215" y="352" text-anchor="middle" fill="#374151" font-size="12.5">BD ≤ BE + DE；等号 ⟺ E 落在 BD 上 ⟺ A, B, C, D 共圆</text>
</svg>
