<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：反演保角（反向）
     反演圆 Γ：圆心 O=(170,230)、半径 100px（= 数学单位 1）。
     两条过 P 的直线 ℓ: x=0.5（px x=220）、m: y=0.5（px y=180），交于 P=(0.5,0.5)（px (220,180)）。
     反演后 ℓ → 圆 C₁（圆心 (1,0)=(270,230)、半径 100，过 O 与 P′），
            m → 圆 C₂（圆心 (0,1)=(170,130)、半径 100，过 O 与 P′）。
     P′ = P/|P|² = (1,1)（px (270,130)），恰为 C₁,C₂ 的第二个交点。
     P 处两直线夹角 90° ⟺ P′ 处两圆切线夹角 90°（方向反转）。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 400 330" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- ===== 反演圆 Γ ===== -->
  <circle cx="170" cy="230" r="100" fill="none" stroke="#1f3a5f" stroke-width="2.5"/>
  <text x="64" y="226" text-anchor="end" fill="#374151" font-size="16">Γ</text>

  <!-- ===== 两条过 P 的直线（原曲线，灰色） ===== -->
  <line x1="220" y1="52" x2="220" y2="305" stroke="#6b7280" stroke-width="2.2"/>
  <text x="228" y="66" fill="#6b7280" font-size="16" font-style="italic">ℓ</text>
  <line x1="55" y1="180" x2="380" y2="180" stroke="#6b7280" stroke-width="2.2"/>
  <text x="60" y="172" fill="#6b7280" font-size="16" font-style="italic">m</text>

  <!-- ===== 像圆 C₁（ℓ 的像）、C₂（m 的像），均过 O 与 P′ ===== -->
  <circle cx="270" cy="230" r="100" fill="none" stroke="#1f3a5f" stroke-width="2.2"/>
  <circle cx="170" cy="130" r="100" fill="none" stroke="#1f3a5f" stroke-width="2.2"/>
  <text x="352" y="332" text-anchor="middle" fill="#1f3a5f" font-size="14">ℓ 的像</text>
  <text x="170" y="52" text-anchor="middle" fill="#1f3a5f" font-size="14">m 的像</text>

  <!-- ===== 射线 O → P → P′（辅助虚线） ===== -->
  <line x1="170" y1="230" x2="292" y2="108" stroke="#9aa7b8" stroke-width="1.8" stroke-dasharray="5 4"/>

  <!-- ===== 直角标记：P 处（两直线）、P′ 处（两圆切线） ===== -->
  <path d="M 220 166 L 234 166 L 234 180" fill="none" stroke="#6b7280" stroke-width="1.8"/>
  <path d="M 270 116 L 284 116 L 284 130" fill="none" stroke="#1f3a5f" stroke-width="1.8"/>
  <text x="246" y="160" fill="#6b7280" font-size="15" font-style="italic">θ</text>
  <text x="296" y="112" fill="#1f3a5f" font-size="15" font-style="italic">θ</text>

  <!-- ===== 点 O、P、P′ ===== -->
  <circle cx="170" cy="230" r="4.5" fill="#1f3a5f"/>
  <text x="160" y="250" text-anchor="end" fill="#374151" font-size="16">O</text>
  <circle cx="220" cy="180" r="4.5" fill="#6b7280"/>
  <text x="228" y="198" fill="#374151" font-size="16">P</text>
  <circle cx="270" cy="130" r="4.5" fill="#1f3a5f"/>
  <text x="280" y="146" fill="#374151" font-size="16">P′</text>

  <!-- ===== 底部说明 ===== -->
  <text x="220" y="345" text-anchor="middle" fill="#6b7280" font-size="13">过 P 的两条直线 → 过 O 与 P′ 的两个圆；夹角 θ 不变（反向）</text>
</svg>
