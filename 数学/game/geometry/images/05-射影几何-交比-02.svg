<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：实数轴上四点 A=1, B=2（基准对·深蓝）, C=3, D=4（插入对·红），用于交比 (A,B;C,D) 的定义
     数轴等距（单位 110px），坐标整数对齐；文字为真 <text>，清晰锐利、易改。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 130" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
  </defs>

  <!-- x 轴（带箭头） + 变量名 x -->
  <line x1="30" y1="65" x2="570" y2="65" stroke="#1f3a5f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <text x="586" y="69" font-style="italic" fill="#374151" font-size="16">x</text>

  <!-- 刻度线 1,2,3,4（跨轴两侧） -->
  <g stroke="#1f3a5f" stroke-width="2.5" stroke-linecap="round">
    <line x1="200" y1="56" x2="200" y2="74"/>
    <line x1="310" y1="56" x2="310" y2="74"/>
    <line x1="420" y1="56" x2="420" y2="74"/>
    <line x1="530" y1="56" x2="530" y2="74"/>
  </g>
  <!-- 刻度数字（轴下方） -->
  <g text-anchor="middle" fill="#6b7280" font-size="14">
    <text x="200" y="95">1</text>
    <text x="310" y="95">2</text>
    <text x="420" y="95">3</text>
    <text x="530" y="95">4</text>
  </g>

  <!-- 四点：A,B 基准对（深蓝）；C,D 插入对（红） -->
  <circle cx="200" cy="65" r="6" fill="#1f3a5f"/>
  <circle cx="310" cy="65" r="6" fill="#1f3a5f"/>
  <circle cx="420" cy="65" r="6" fill="#c0392b"/>
  <circle cx="530" cy="65" r="6" fill="#c0392b"/>

  <!-- 点字母标签（轴上方，斜体） -->
  <g text-anchor="middle" fill="#374151" font-size="16" font-style="italic">
    <text x="200" y="42">A</text>
    <text x="310" y="42">B</text>
    <text x="420" y="42">C</text>
    <text x="530" y="42">D</text>
  </g>
</svg>
