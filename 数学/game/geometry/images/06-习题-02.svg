<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：托勒密定理（题2）。圆内接四边形 ABCD（取正方形示意）：
     A(200,80) B(320,180) C(200,280) D(80,180)，圆心(200,180) r=100。
     对角线 AC,BD。AC·BD = AB·CD + AD·BC。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 380 320" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <!-- 外接圆 -->
  <circle cx="200" cy="180" r="120" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.4"/>

  <!-- 四边形 -->
  <polygon points="200,60 320,180 200,300 80,180" fill="none" stroke="#1f3a5f" stroke-width="2.2"/>

  <!-- 对角线（红） -->
  <line x1="200" y1="60"  x2="200" y2="300" stroke="#c0463a" stroke-width="2"/>
  <line x1="80"  y1="180" x2="320" y2="180" stroke="#c0463a" stroke-width="2"/>

  <!-- 顶点 -->
  <circle cx="200" cy="60" r="4.5" fill="#1f3a5f"/><text x="200" y="52" text-anchor="middle" fill="#1f3a5f" font-size="15" font-style="italic">A</text>
  <circle cx="320" cy="180" r="4.5" fill="#1f3a5f"/><text x="328" y="176" fill="#1f3a5f" font-size="15" font-style="italic">B</text>
  <circle cx="200" cy="300" r="4.5" fill="#1f3a5f"/><text x="200" y="316" text-anchor="middle" fill="#1f3a5f" font-size="15" font-style="italic">C</text>
  <circle cx="80" cy="180" r="4.5" fill="#1f3a5f"/><text x="72" y="176" text-anchor="end" fill="#1f3a5f" font-size="15" font-style="italic">D</text>

  <text x="200" y="180" text-anchor="middle" fill="#c0463a" font-size="13">AC·BD = AB·CD + AD·BC</text>
</svg>
