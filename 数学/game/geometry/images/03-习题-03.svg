<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 380 330" text-rendering="geometricPrecision" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<!-- 题3（新增）螺旋相似 z↦2iz+3−2i 的不动点 z₀=1.4+0.8i：
     P=3.4+0.8i 的像 σ(P)=1.4+4.8i = z₀+2i·(P−z₀) —— 绕 z₀ 转 90°、放大 2 倍。 -->
<defs><marker id="aG3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7b8"/></marker>
<marker id="aR3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0463a"/></marker></defs>
<text x="60" y="44" fill="#374151" font-size="14">σ : z ↦ 2iz + 3 − 2i</text>
<line x1="40" y1="320" x2="386" y2="320" stroke="#9aa7b8" stroke-width="1.2" marker-end="url(#aG3)"/>
<line x1="40" y1="320" x2="40" y2="52" stroke="#9aa7b8" stroke-width="1.2" marker-end="url(#aG3)"/>
<text x="380" y="338" text-anchor="middle" fill="#9aa7b8" font-size="11" font-style="italic">Re</text>
<text x="28" y="48" text-anchor="middle" fill="#9aa7b8" font-size="11" font-style="italic">Im</text>
<line x1="152.0" y1="280.0" x2="312.0" y2="280.0" stroke="#1f3a5f" stroke-width="2.4"/>
<line x1="152.0" y1="280.0" x2="152.0" y2="80.0" stroke="#c0463a" stroke-width="2.4"/>
<polyline points="164.0,280.0 164.0,268.0 152.0,268.0" fill="none" stroke="#9aa7b8" stroke-width="1.3"/>
<path d="M186.0,280.0 A34,34 0 0 0 152.0,246.0" fill="none" stroke="#c0463a" stroke-width="1.5" marker-end="url(#aR3)"/>
<text x="192" y="240" fill="#c0463a" font-size="11.5">转 90°</text>
<text x="232.0" y="272.0" text-anchor="middle" fill="#1f3a5f" font-size="11.5" font-style="italic">|z₀P|</text>
<text x="162.0" y="180.0" fill="#c0463a" font-size="11.5" font-style="italic">2·|z₀P|</text>
<circle cx="152.0" cy="280.0" r="4.5" fill="#c0463a"/>
<text x="144.0" y="272.0" text-anchor="end" fill="#c0463a" font-size="13" font-style="italic">z₀</text>
<text x="144.0" y="300.0" text-anchor="end" fill="#c0463a" font-size="11">不动点 (1.4, 0.8)</text>
<circle cx="312.0" cy="280.0" r="4" fill="#1f3a5f"/>
<text x="312.0" y="302.0" text-anchor="middle" fill="#1f3a5f" font-size="12" font-style="italic">P = 3.4 + 0.8i</text>
<circle cx="152.0" cy="80.0" r="4" fill="#1f3a5f"/>
<text x="160.0" y="76.0" fill="#1f3a5f" font-size="12" font-style="italic">σ(P) = 1.4 + 4.8i</text>
<text x="200" y="346" text-anchor="middle" fill="#1f3a5f" font-size="12.5">绕 z₀ 转 90°、放大 2 倍（|a| = 2，arg a = 90°）</text>
</svg>
