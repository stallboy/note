<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 480 340" text-rendering="geometricPrecision" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<!-- 题2 正向相似把 AB 映到 CD：α=(d−c)/(b−a)。|CD|=1.3·|AB|，旋转角 θ=arg α=40°。
     C 处虚线为 AB 方向的平移拷贝，弧 θ 即旋转角。 -->
<defs>
  <marker id="aB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker>
  <marker id="aR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0463a"/></marker>
  <marker id="aG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7b8"/></marker>
</defs>
<text x="40" y="52" fill="#374151" font-size="14">相似变换 z ↦ αz + β：</text>
<text x="40" y="76" fill="#374151" font-size="15">α = (d − c)/(b − a)</text>
<text x="40" y="98" fill="#6b7280" font-size="13">相似比 = |α| = |CD|/|AB|，旋转角 = arg α</text>
<line x1="90" y1="190" x2="210" y2="130" stroke="#1f3a5f" stroke-width="3" marker-end="url(#aB)"/>
<circle cx="90" cy="190" r="4.5" fill="#1f3a5f"/>
<text x="82" y="206" text-anchor="end" fill="#1f3a5f" font-size="16" font-style="italic">A</text>
<text x="218" y="124" fill="#1f3a5f" font-size="16" font-style="italic">B</text>
<line x1="300" y1="260" x2="369.4" y2="100.0" stroke="#c0463a" stroke-width="3" marker-end="url(#aR)"/>
<circle cx="300" cy="260" r="4.5" fill="#c0463a"/>
<text x="292" y="276" text-anchor="end" fill="#c0463a" font-size="16" font-style="italic">C</text>
<text x="377.4" y="96.0" fill="#c0463a" font-size="16" font-style="italic">D</text>
<text x="142.0" y="148.0" text-anchor="middle" fill="#1f3a5f" font-size="12.5">|AB|</text>
<text x="350.7" y="182.0" fill="#c0463a" font-size="12.5">|CD|</text>
<line x1="300" y1="260" x2="349.2" y2="235.4" stroke="#9aa7b8" stroke-width="1.6" stroke-dasharray="5 4"/>
<path d="M330.4,244.8 A34,34 0 0 0 313.5,228.8" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#aG)"/>
<text x="337.1" y="220.8" fill="#374151" font-size="12.5">θ = arg α</text>
<path d="M165,148 Q245,50 330,182" fill="none" stroke="#9aa7b8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#aG)"/>
</svg>
