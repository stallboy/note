<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：相似变换把 AB 映到 CD（题2）。A(80,200) B(200,140)；
     C(280,300) D(440,220)。a=(d-c)/(b-a)：相似比=|CD|/|AB|，旋转角=arg(a)。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 480 340" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 线段 AB（蓝） -->
  <line x1="80" y1="200" x2="200" y2="140" stroke="#1f3a5f" stroke-width="3" marker-end="url(#arr)"/>
  <circle cx="80" cy="200" r="4.5" fill="#1f3a5f"/>
  <text x="72" y="214" text-anchor="end" fill="#1f3a5f" font-size="16" font-style="italic">A</text>
  <text x="206" y="134" fill="#1f3a5f" font-size="16" font-style="italic">B</text>

  <!-- 线段 CD（红） -->
  <line x1="280" y1="300" x2="440" y2="220" stroke="#c0463a" stroke-width="3" marker-end="url(#arr)"/>
  <circle cx="280" cy="300" r="4.5" fill="#c0463a"/>
  <text x="272" y="314" text-anchor="end" fill="#c0463a" font-size="16" font-style="italic">C</text>
  <text x="446" y="214" fill="#c0463a" font-size="16" font-style="italic">D</text>

  <!-- 公式标注 -->
  <text x="40" y="50" fill="#374151" font-size="14">相似变换 z ↦ αz + β：</text>
  <text x="40" y="74" fill="#374151" font-size="15">α = (d − c)/(b − a)</text>
  <text x="40" y="96" fill="#6b7280" font-size="13">相似比 = |α| = |CD|/|AB|，旋转角 = arg α</text>

  <!-- 弯箭头表示"映到" -->
  <path d="M170,170 Q230,150 270,260" fill="none" stroke="#9aa7b8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)"/>
</svg>
