<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：Koch 雪花（题4）。初始正三角形 A(200,140) B(140,244) C(260,244)，边长 120；
     每步把每边中间 1/3 替换成向外凸的等边三角形（每段是整体的相似拷贝，比 1/3）。
     图示底边一次凸起：小三角顶 (200,209.4)。周长 → ∞，面积 = 2√3/5。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 380 320" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <!-- 初始三角形（淡） -->
  <polygon points="200,140 140,244 260,244" fill="#eef2f7" stroke="#9aa7b8" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round"/>

  <!-- Koch 一次迭代后的底边凸起（蓝实线），其余两边画一段示意凸起 -->
  <polyline points="140,244 180,244 200,209.4 220,244 260,244" fill="none" stroke="#1f3a5f" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- 左边 AB 的凸起 -->
  <polyline points="200,140 180,176 158,168 140,244" fill="none" stroke="#1f3a5f" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- 右边 AC 的凸起 -->
  <polyline points="200,140 220,176 242,168 260,244" fill="none" stroke="#1f3a5f" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- 凸起小三角高亮（底边那个） -->
  <polygon points="180,244 220,244 200,209.4" fill="#f4d9d6" stroke="#c0463a" stroke-width="1.6"/>

  <text x="200" y="270" text-anchor="middle" fill="#c0463a" font-size="12">每段凸起 = 相似拷贝（比 1/3）</text>
  <text x="200" y="300" text-anchor="middle" fill="#1f3a5f" font-size="13">周长 → ∞</text>
  <text x="200" y="318" text-anchor="middle" fill="#1f3a5f" font-size="13">面积 = 2√3 / 5</text>
</svg>
