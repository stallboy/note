<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 400 410" text-rendering="geometricPrecision" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<!-- 题1 欧拉线。△ABC 中：外心 O(200,200)、重心 G(166.7,220)、垂心 H(100,260) 共线，GH=2·OG。
     外接圆 + 中线（A→BC中点，过 G）+ 高（A→BC，过 H）。OG 单杠、GH 双杠表示 2 倍关系。 -->
<circle cx="200.0" cy="200.0" r="172.0" fill="none" stroke="#9aa7b8" stroke-width="1.6"/>
<polygon points="100.0,60.0 60.0,300.0 340.0,300.0" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="100" y1="60" x2="200.0" y2="300.0" stroke="#9aa7b8" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="100" y1="60" x2="100" y2="300" stroke="#9aa7b8" stroke-width="1.4" stroke-dasharray="5 4"/>
<line x1="130.0" y1="294" x2="130.0" y2="306" stroke="#9aa7b8" stroke-width="1.6"/>
<line x1="270.0" y1="294" x2="270.0" y2="306" stroke="#9aa7b8" stroke-width="1.6"/>
<polyline points="100,291 109,291 109,300" fill="none" stroke="#9aa7b8" stroke-width="1.3"/>
<line x1="255.0" y1="167.0" x2="38.0" y2="297.2" stroke="#c0463a" stroke-width="2.4"/>
<line x1="129.3" y1="236.0" x2="137.3" y2="244.0" stroke="#c0463a" stroke-width="1.6"/>
<line x1="186.4" y1="215.1" x2="180.2" y2="204.9" stroke="#c0463a" stroke-width="1.8"/>
<line x1="153.1" y1="235.1" x2="146.9" y2="224.9" stroke="#c0463a" stroke-width="1.8"/>
<line x1="119.8" y1="255.1" x2="113.6" y2="244.9" stroke="#c0463a" stroke-width="1.8"/>
<text x="100" y="48" text-anchor="middle" fill="#1f3a5f" font-size="15" font-style="italic">A</text>
<text x="50" y="314" text-anchor="end" fill="#1f3a5f" font-size="15" font-style="italic">B</text>
<text x="350" y="314" fill="#1f3a5f" font-size="15" font-style="italic">C</text>
<circle cx="200.0" cy="200.0" r="4.5" fill="#c0463a"/>
<text x="213.0" y="218.0" text-anchor="start" fill="#c0463a" font-size="15" font-style="italic">O</text>
<text x="213.0" y="232.0" text-anchor="start" fill="#c0463a" font-size="11">外心</text>
<circle cx="166.7" cy="220.0" r="4.5" fill="#c0463a"/>
<text x="156.7" y="246.0" text-anchor="end" fill="#c0463a" font-size="15" font-style="italic">G</text>
<text x="156.7" y="260.0" text-anchor="end" fill="#c0463a" font-size="11">重心</text>
<circle cx="100.0" cy="260.0" r="4.5" fill="#c0463a"/>
<text x="88.0" y="246.0" text-anchor="end" fill="#c0463a" font-size="15" font-style="italic">H</text>
<text x="88.0" y="260.0" text-anchor="end" fill="#c0463a" font-size="11">垂心</text>
<text x="316" y="105" text-anchor="middle" fill="#9aa7b8" font-size="11">外接圆</text>
<text x="200" y="415" text-anchor="middle" fill="#c0463a" font-size="13">欧拉线：O, G, H 共线，GH = 2·OG（三段单杠等长）</text>
</svg>
