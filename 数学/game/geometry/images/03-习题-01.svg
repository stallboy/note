<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：欧拉线（题1）。△ABC：A(180,80) B(80,280) C(320,280)；
     外心 O(200,215)、重心 G(193,213)、垂心 H(180,210) 三点共线（欧拉线），GH≈2·OG。
     以 G 为心、比 -1/2 的位似把 △ABC 映到中点三角形，把 O 映到 OH 中点（九点圆心）。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 400 320" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <!-- △ABC -->
  <polygon points="180,80 80,280 320,280" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 欧拉线 O-G-H -->
  <line x1="180" y1="210" x2="200" y2="215" stroke="#c0463a" stroke-width="2.4"/>

  <!-- O, G, H 三点 -->
  <circle cx="200" cy="215" r="4.5" fill="#c0463a"/>
  <text x="208" y="212" fill="#c0463a" font-size="15" font-style="italic">O</text>
  <text x="208" y="228" fill="#c0463a" font-size="12">外心</text>

  <circle cx="193" cy="213" r="4.5" fill="#c0463a"/>
  <text x="193" y="200" text-anchor="middle" fill="#c0463a" font-size="15" font-style="italic">G</text>
  <text x="193" y="244" text-anchor="middle" fill="#c0463a" font-size="12">重心</text>

  <circle cx="180" cy="210" r="4.5" fill="#c0463a"/>
  <text x="172" y="206" text-anchor="end" fill="#c0463a" font-size="15" font-style="italic">H</text>
  <text x="172" y="222" text-anchor="end" fill="#c0463a" font-size="12">垂心</text>

  <!-- 顶点 -->
  <text x="180" y="72" text-anchor="middle" fill="#1f3a5f" font-size="15" font-style="italic">A</text>
  <text x="72" y="294" text-anchor="end" fill="#1f3a5f" font-size="15" font-style="italic">B</text>
  <text x="328" y="294" fill="#1f3a5f" font-size="15" font-style="italic">C</text>

  <text x="200" y="312" text-anchor="middle" fill="#c0463a" font-size="13">欧拉线：O, G, H 共线，GH = 2·OG</text>
</svg>
