<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：梅涅劳斯定理（题3）。△ABC：A(200,60) B(60,300) C(360,300)；
     截线 ℓ 斜率 16/35，过 F(140,162.9)∈AB、E(325,247.4)∈CA、D(440,300)∈BC 延长线。
     有向比：(BD/DC)·(CE/EA)·(AF/FB) = (−19/4)·(16/57)·(3/4) = −1。
     BC 边 C 之后画虚线表示延长线。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 490 320" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <text x="500" y="44" text-anchor="end" fill="#c0463a" font-size="13">(BD/DC)·(CE/EA)·(AF/FB) = −1</text>

  <!-- △ABC -->
  <polygon points="200,60 60,300 360,300" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- BC 的延长线（C 到 D，虚线） -->
  <line x1="360" y1="300" x2="440" y2="300" stroke="#1f3a5f" stroke-width="1.8" stroke-dasharray="5 4"/>

  <!-- 截线 ℓ（红），两端伸出三角形 -->
  <line x1="105" y1="147" x2="475" y2="316" stroke="#c0463a" stroke-width="2.4"/>
  <text x="480" y="310" fill="#c0463a" font-size="14" font-style="italic">ℓ</text>

  <!-- D, E, F 点 -->
  <circle cx="440" cy="300" r="4.5" fill="#c0463a"/>
  <text x="450" y="295" fill="#c0463a" font-size="15" font-style="italic">D</text>
  <circle cx="325" cy="247.4" r="4.5" fill="#c0463a"/>
  <text x="334" y="243" fill="#c0463a" font-size="15" font-style="italic">E</text>
  <circle cx="140" cy="162.9" r="4.5" fill="#c0463a"/>
  <text x="130" y="157" text-anchor="end" fill="#c0463a" font-size="15" font-style="italic">F</text>

  <!-- 顶点 -->
  <text x="200" y="52" text-anchor="middle" fill="#1f3a5f" font-size="16" font-style="italic">A</text>
  <text x="52" y="316" text-anchor="end" fill="#1f3a5f" font-size="16" font-style="italic">B</text>
  <text x="368" y="316" fill="#1f3a5f" font-size="16" font-style="italic">C</text>
</svg>
