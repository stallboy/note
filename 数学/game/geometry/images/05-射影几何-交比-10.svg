<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：帕普斯定理 —— 两直线各取三点 A B C 与 A′ B′ C′，
     三对交叉连线的交点 P = AB′∩A′B、Q = AC′∩A′C、R = BC′∩B′C 共线（帕普斯线）。
     P Q R 坐标由两组直线方程解析求解，确实共线（斜率 -0.061）。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 85 545 295" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <!-- 两条基线 -->
  <line x1="60" y1="120" x2="540" y2="120" stroke="#1f3a5f" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="60" y1="350" x2="540" y2="290" stroke="#1f3a5f" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 六条交叉连线 -->
  <g stroke="#9ca3af" stroke-width="1.4" stroke-linecap="round">
    <line x1="110" y1="120" x2="300" y2="320"/>
    <line x1="150" y1="339" x2="270" y2="120"/>
    <line x1="110" y1="120" x2="450" y2="301"/>
    <line x1="150" y1="339" x2="430" y2="120"/>
    <line x1="270" y1="120" x2="450" y2="301"/>
    <line x1="300" y1="320" x2="430" y2="120"/>
  </g>

  <!-- 帕普斯线（过 P Q R，红虚线） -->
  <line x1="150" y1="230.5" x2="470" y2="211" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>

  <!-- 基线上六点 -->
  <g fill="#1f3a5f">
    <circle cx="110" cy="120" r="4.5"/>
    <circle cx="270" cy="120" r="4.5"/>
    <circle cx="430" cy="120" r="4.5"/>
    <circle cx="150" cy="339" r="4.5"/>
    <circle cx="300" cy="320" r="4.5"/>
    <circle cx="450" cy="301" r="4.5"/>
  </g>

  <!-- P Q R（红色） -->
  <g fill="#c0392b">
    <circle cx="211.5" cy="226.8" r="4.5"/>
    <circle cx="300.4" cy="221.4" r="4.5"/>
    <circle cx="366.8" cy="217.3" r="4.5"/>
  </g>

  <!-- 标签 -->
  <g font-size="16" fill="#374151">
    <text x="110" y="110" text-anchor="middle">A</text>
    <text x="270" y="110" text-anchor="middle">B</text>
    <text x="430" y="110" text-anchor="middle">C</text>
    <text x="150" y="360" text-anchor="middle">A′</text>
    <text x="300" y="341" text-anchor="middle">B′</text>
    <text x="450" y="322" text-anchor="middle">C′</text>
  </g>
  <g font-size="16" fill="#c0392b">
    <text x="203" y="248" text-anchor="middle">P</text>
    <text x="296" y="243" text-anchor="middle">Q</text>
    <text x="365" y="239" text-anchor="middle">R</text>
    <text x="478" y="214">帕普斯线</text>
  </g>
</svg>
