<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：平移 x ↦ x+t 的两次中心投影实现（实例 t=2）。
     摆设：读数线 ℓ: y=1，中间线 m: y=0（与 ℓ 平行——交点推到无穷远，复合才没有普通不动点），
     两个视点同在观望线 y=2 上：C₁=(0,2)、C₂=(2t,2)=(4,2)。
     ① 从 C₁ 投到 m：x ↦ 2x（比率 2 的位似）；② 从 C₂ 投回 ℓ：u ↦ u/2 + t（比率 1/2 的位似）。
     复合 x ↦ x+t。追踪两点：x=0 → 0 → 2，x=1 → 2 → 3（精确计算）。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 128 470 200" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- 观望线 y=2（淡灰虚线） -->
  <line x1="30" y1="160" x2="360" y2="160" stroke="#9ca3af" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- ① 从 C₁ 出发的射线（灰虚线）：穿过 ℓ 上原象，落到 m -->
  <g stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round">
    <line x1="60" y1="160" x2="60" y2="294"/>
    <line x1="60" y1="160" x2="194" y2="294"/>
  </g>

  <!-- ② 从 C₂ 出发的射线（绿虚线）：穿过 m 上中继点，捞回 ℓ -->
  <g stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 4" stroke-linecap="round">
    <line x1="300" y1="160" x2="38" y2="291"/>
    <line x1="300" y1="160" x2="164" y2="297"/>
  </g>

  <!-- 读数线 ℓ: y=1（深）与中间线 m: y=0（灰） -->
  <line x1="30" y1="220" x2="410" y2="220" stroke="#1f3a5f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="280" x2="410" y2="280" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>

  <!-- ℓ 上：原象 x（深蓝）与最终像 x+t（蓝） -->
  <g fill="#1f3a5f">
    <circle cx="60" cy="220" r="4.5"/>
    <circle cx="120" cy="220" r="4.5"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="180" cy="220" r="4.5"/>
    <circle cx="240" cy="220" r="4.5"/>
  </g>

  <!-- m 上中继点（绿）：2x -->
  <g fill="#16a34a">
    <circle cx="60" cy="280" r="4.5"/>
    <circle cx="180" cy="280" r="4.5"/>
  </g>

  <!-- 平移箭头：x → x+t -->
  <path d="M 68 208 Q 120 190 170 205" fill="none" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arB)"/>

  <!-- 视点 C₁、C₂ -->
  <g fill="#b45309">
    <circle cx="60" cy="160" r="5"/>
    <circle cx="300" cy="160" r="5"/>
  </g>

  <!-- 标签 -->
  <g font-size="14" fill="#b45309" font-weight="600">
    <text x="60" y="148" text-anchor="middle">C₁</text>
    <text x="300" y="148" text-anchor="middle">C₂</text>
  </g>
  <g font-size="14" fill="#374151">
    <text x="368" y="164">y=2</text>
    <text x="418" y="224">ℓ: y=1</text>
    <text x="418" y="284">m: y=0</text>
  </g>
  <g font-size="14" fill="#1f3a5f" text-anchor="middle">
    <text x="60" y="242">0</text>
    <text x="120" y="242">1</text>
  </g>
  <g font-size="14" fill="#1d4ed8" text-anchor="middle">
    <text x="180" y="242">2</text>
    <text x="240" y="242">3</text>
    <text x="120" y="186">+t</text>
  </g>
  <g font-size="13" fill="#15803d">
    <text x="48" y="302" text-anchor="end">0</text>
    <text x="192" y="304" text-anchor="start">2</text>
  </g>
</svg>
