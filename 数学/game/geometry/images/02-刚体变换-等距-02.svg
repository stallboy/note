<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：两条竖直平行镜面 x=0 与 x=1 上的反射复合 = 一个平移
     P=(-0.6,0.6) 经 S₁ 映到 (0.6,0.6)，再经 S₂ 映到 (1.4,0.6)，净位移 = 2（= 2 × 镜距 1）
     坐标按反射变换精确计算（S₁: x→-x；S₂: x→2-x）；文字为真 <text>，清晰锐利、易改。
     配色与 01 样板一致：填充/主描边 #1f3a5f，辅助虚线 #9aa7b8，箭头/小注 #6b7280，主标签 #374151。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 625 560" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7b8"/>
    </marker>
  </defs>

  <!-- 坐标轴（浅灰；箭头同色） -->
  <line x1="30"  y1="315" x2="585" y2="315" stroke="#9aa7b8" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="180" y1="540" x2="180" y2="45"  stroke="#9aa7b8" stroke-width="1.5" marker-end="url(#arrG)"/>
  <text x="594" y="320" fill="#6b7280" font-size="15" font-style="italic">x</text>
  <text x="180" y="34"  text-anchor="middle" fill="#6b7280" font-size="15" font-style="italic">y</text>

  <!-- 两条平行镜面（深蓝主描边；镜面1 与 y 轴重合） -->
  <line x1="180" y1="495" x2="180" y2="75" stroke="#1f3a5f" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="330" y1="495" x2="330" y2="75" stroke="#1f3a5f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="98"  y="84" text-anchor="middle" fill="#1f3a5f" font-size="15">镜面1</text>
  <text x="412" y="84" text-anchor="middle" fill="#1f3a5f" font-size="15">镜面2</text>

  <!-- 镜面间距测量（灰双向箭头，距离 = 1） -->
  <line x1="180" y1="472.5" x2="330" y2="472.5" stroke="#6b7280" stroke-width="1.8"
        marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="255" y="490" text-anchor="middle" fill="#6b7280" font-size="13">距离 = 1</text>

  <!-- 反射路径虚线：P → S₁(P) → S₂S₁(P)
       中点分别落在镜面1 (x=180) 与镜面2 (x=330) 上，体现反射对称 -->
  <g stroke="#9aa7b8" stroke-width="1.8" stroke-dasharray="5 4" fill="none">
    <line x1="90"  y1="225" x2="270" y2="225"/>
    <line x1="270" y1="225" x2="390" y2="225"/>
  </g>

  <!-- 净平移指示箭头：P → S₂S₁(P)，平移 = 2（= 2 × 镜距） -->
  <line x1="90" y1="288" x2="390" y2="288" stroke="#6b7280" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="240" y="305" text-anchor="middle" fill="#6b7280" font-size="13">平移 = 2</text>

  <!-- 三个点：P（原图，深蓝）、S₁(P)（中间像，灰）、S₂S₁(P)（最终像，深蓝） -->
  <circle cx="90"  cy="225" r="5" fill="#1f3a5f" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="270" cy="225" r="5" fill="#6b7280" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="390" cy="225" r="5" fill="#1f3a5f" stroke="#ffffff" stroke-width="1.2"/>

  <!-- 点标签（数学字母斜体，下标用 Unicode） -->
  <text x="80"  y="230" text-anchor="end"    fill="#374151" font-size="16" font-style="italic">P</text>
  <text x="270" y="212" text-anchor="middle" fill="#374151" font-size="16" font-style="italic">S₁(P)</text>
  <text x="390" y="212" text-anchor="middle" fill="#374151" font-size="16" font-style="italic">S₂S₁(P)</text>
</svg>
