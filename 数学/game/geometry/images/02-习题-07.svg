<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：拿破仑定理（题7）。任意 ΔABC：A(220,90) B(90,300) C(360,300)；
     三边外等边 Δ：BC 外 Da(225,534)，CA 外 Db(472,74)，AB 外 Dc(-27,83)；
     外心 Oa(225,378), Ob(351,155), Oc(94,158)，构成等边 ΔOaObOc（边长 ≈256，已数值验证）。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 40 560 510" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <!-- 三个外等边三角形（淡、虚线） -->
  <polygon points="90,300 360,300 225,534" fill="#eef2f7" stroke="#9aa7b8" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round"/>
  <polygon points="360,300 220,90 472,74"  fill="#eef2f7" stroke="#9aa7b8" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round"/>
  <polygon points="220,90 90,300 -27,83"   fill="#eef2f7" stroke="#9aa7b8" stroke-width="1.5" stroke-dasharray="5 4" stroke-linejoin="round"/>

  <!-- 原 ΔABC -->
  <polygon points="220,90 90,300 360,300" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 外拿破仑三角形 ΔOaObOc（红高亮） -->
  <polygon points="225,378 351,155 94,158" fill="#f4d9d6" stroke="#c0463a" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- 三个外心 -->
  <circle cx="225" cy="378" r="4.8" fill="#c0463a"/>
  <text x="225" y="398" text-anchor="middle" fill="#c0463a" font-size="15" font-style="italic">Oa</text>
  <circle cx="351" cy="155" r="4.8" fill="#c0463a"/>
  <text x="364" y="151" fill="#c0463a" font-size="15" font-style="italic">Ob</text>
  <circle cx="94" cy="158" r="4.8" fill="#c0463a"/>
  <text x="80" y="154" text-anchor="end" fill="#c0463a" font-size="15" font-style="italic">Oc</text>

  <!-- ΔABC 顶点 -->
  <circle cx="220" cy="90" r="4.5" fill="#1f3a5f"/>
  <text x="220" y="80" text-anchor="middle" fill="#1f3a5f" font-size="16" font-style="italic">A</text>
  <circle cx="90" cy="300" r="4.5" fill="#1f3a5f"/>
  <text x="76" y="316" text-anchor="end" fill="#1f3a5f" font-size="16" font-style="italic">B</text>
  <circle cx="360" cy="300" r="4.5" fill="#1f3a5f"/>
  <text x="374" y="316" fill="#1f3a5f" font-size="16" font-style="italic">C</text>

  <text x="250" y="500" text-anchor="middle" fill="#c0463a" font-size="13">外拿破仑三角形 ΔOaObOc（等边）</text>
</svg>
