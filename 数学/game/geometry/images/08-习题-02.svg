<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：正方体面染色（题2）。斜二测正方体；前面涂红（示意一种染色）。
     旋转群 24 元，伯恩赛德 ⟹ 9 种不同染色。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 340 300" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <!-- 正方体：前/上/右三面 -->
  <!-- 上面（蓝） -->
  <polygon points="70,110 170,110 210,70 110,70" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2" stroke-linejoin="round"/>
  <!-- 右面（蓝） -->
  <polygon points="170,110 210,70 210,170 170,210" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2" stroke-linejoin="round"/>
  <!-- 前面（红） -->
  <polygon points="70,110 170,110 170,210 70,210" fill="#f4d9d6" stroke="#c0463a" stroke-width="2" stroke-linejoin="round"/>

  <text x="120" y="160" text-anchor="middle" fill="#c0463a" font-size="14" font-style="italic">红</text>

  <text x="160" y="250" text-anchor="middle" fill="#1f3a5f" font-size="13">2 色染 6 面，旋转下共 9 种</text>
  <text x="160" y="270" text-anchor="middle" fill="#6b7280" font-size="12">（伯恩赛德：216 / 24 = 9）</text>
</svg>
