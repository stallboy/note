<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa7b8"/>
    </marker>
  </defs>

  <!-- 一对相似：小蓝 △MAB 与大红 △MCD（绕 M 转 θ=40°、放缩 k=1.5） -->
  <polygon points="60.0,330.0 155.0,330.0 250.0,254.0" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="60.0,330.0 169.2,238.4 205.0,59.5" fill="#f6dcd6" stroke="#a83a2c" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 另一对相似（虚线）：△MAC 与 △MBD -->
  <line x1="155.0" y1="330.0" x2="169.2" y2="238.4" stroke="#b45309" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="250.0" y1="254.0" x2="205.0" y2="59.5" stroke="#b45309" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- 对数螺线：A→C、B→D -->
  <polyline points="155.0,330.0 157.7,325.1 160.2,320.0 162.5,314.6 164.6,308.9 166.4,302.9 168.0,296.7 169.3,290.2 170.4,283.5 171.1,276.5 171.5,269.3 171.5,261.9 171.1,254.2 170.3,246.4 169.2,238.4" fill="none" stroke="#9aa7b8" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <polyline points="250.0,254.0 251.4,242.1 252.3,229.8 252.6,217.1 252.2,204.1 251.1,190.7 249.4,177.0 246.8,162.9 243.5,148.7 239.4,134.1 234.4,119.4 228.5,104.6 221.6,89.6 213.8,74.5 205.0,59.5" fill="none" stroke="#9aa7b8" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- 转角 θ -->
  <path d="M 93.2,330.0 L 93.2,327.7 L 92.9,325.4 L 92.5,323.1 L 92.0,320.8 L 91.2,318.6 L 90.4,316.5 L 89.4,314.4 L 88.2,312.4 L 86.9,310.5 L 85.5,308.6" fill="none" stroke="#374151" stroke-width="1.6"/>
  <text x="109.1" y="317.1" text-anchor="middle" fill="#374151" font-size="15" font-style="italic">θ</text>

  <!-- 顶点 -->
  <circle cx="60.0" cy="330.0" r="3.2" fill="#111827"/>
  <circle cx="155.0" cy="330.0" r="2.8" fill="#1f3a5f"/>
  <circle cx="250.0" cy="254.0" r="2.8" fill="#1f3a5f"/>
  <circle cx="169.2" cy="238.4" r="2.8" fill="#a83a2c"/>
  <circle cx="205.0" cy="59.5" r="2.8" fill="#a83a2c"/>
  <text x="56.0" y="350.0" text-anchor="end" fill="#111827" font-size="16" font-style="italic" font-weight="bold">M</text>
  <text x="155.0" y="350.0" text-anchor="middle" fill="#374151" font-size="15" font-style="italic">A</text>
  <text x="264.0" y="260.0" fill="#374151" font-size="15" font-style="italic">B</text>
  <text x="163.2" y="256.4" text-anchor="end" fill="#374151" font-size="15" font-style="italic">C</text>
  <text x="217.0" y="63.5" fill="#374151" font-size="15" font-style="italic">D</text>

  <!-- 注记 -->
  <text x="210" y="26" text-anchor="middle" fill="#374151" font-size="15">绕 <tspan font-style="italic">M</tspan> 转 θ = 40°、放缩 <tspan font-style="italic">k</tspan> = 1.5：A ↦ C，B ↦ D</text>
  <text x="330" y="320" text-anchor="middle" fill="#1f3a5f" font-size="13">一对：△MAB ∽ △MCD</text>
  <text x="330" y="340" text-anchor="middle" fill="#b45309" font-size="13">另一对：△MAC ∽ △MBD（虚线）</text>
</svg>
