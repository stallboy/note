<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：时空间隔不变量（光锥）
     1+1 维时空图：横轴 x、纵轴 ct（取 c=1，1 单位 = 25px，原点 O=(150,230)）。
     光的轨迹 ct = ±x（45° 线，琥珀色）：Δs² = 0；
     双曲线 t² − x² = 16（navy，参数 t=4cosh u, x=4sinh u 采样）：Δs² = 16 的等间隔曲线。
     同一事件：P=(x,ct)=(3,5)（px (225,105)），洛伦兹变换后 P′=(0,4)（px (150,130)），
     两点落在同一条双曲线上——坐标全变，间隔不变。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 15 370 260" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/>
    </marker>
  </defs>

  <!-- ===== 光锥：ct = ±x（Δs²=0） ===== -->
  <line x1="150" y1="230" x2="330" y2="50" stroke="#b45309" stroke-width="2.2"/>
  <line x1="150" y1="230" x2="12" y2="92" stroke="#b45309" stroke-width="2.2"/>
  <text x="298" y="42" text-anchor="middle" fill="#b45309" font-size="13">光：Δs² = 0</text>

  <!-- ===== 等间隔双曲线 t²−x²=16（t=4cosh u, x=4sinh u 采样） ===== -->
  <polyline points="32.5,75.7 61.2,105.7 86.3,116.7 108.9,121.9 129.9,128 150,130 170.1,128 191.1,121.9 213.7,116.7 238.8,105.7 267.5,75.7 302.1,49.1"
            fill="none" stroke="#1f3a5f" stroke-width="2.5"/>
  <text x="58" y="62" text-anchor="middle" fill="#1f3a5f" font-size="14">Δs² = 16</text>

  <!-- ===== 坐标轴 ===== -->
  <line x1="25" y1="230" x2="338" y2="230" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr-navy)"/>
  <text x="341" y="246" fill="#374151" font-size="15" font-style="italic">x</text>
  <line x1="150" y1="246" x2="150" y2="22" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arr-navy)"/>
  <text x="160" y="22" fill="#374151" font-size="15" font-style="italic">ct</text>
  <text x="142" y="246" text-anchor="end" fill="#374151" font-size="14">O</text>

  <!-- ===== 刻度与辅助线（P 的坐标） ===== -->
  <line x1="225" y1="105" x2="225" y2="230" stroke="#9aa7b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="150" y1="105" x2="225" y2="105" stroke="#9aa7b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="225" y1="226" x2="225" y2="234" stroke="#374151" stroke-width="1.6"/>
  <text x="225" y="248" text-anchor="middle" fill="#374151" font-size="13">3</text>
  <line x1="146" y1="105" x2="154" y2="105" stroke="#374151" stroke-width="1.6"/>
  <text x="142" y="109" text-anchor="end" fill="#374151" font-size="13">5</text>
  <line x1="146" y1="130" x2="154" y2="130" stroke="#374151" stroke-width="1.6"/>
  <text x="142" y="134" text-anchor="end" fill="#374151" font-size="13">4</text>

  <!-- ===== 同一事件在两个惯性系里的坐标 ===== -->
  <circle cx="225" cy="105" r="4.5" fill="#1f3a5f"/>
  <text x="235" y="99" fill="#374151" font-size="13.5">P = (3, 5)</text>
  <circle cx="150" cy="130" r="4.5" fill="#b45309"/>
  <text x="160" y="152" fill="#b45309" font-size="13.5">P′ = (0, 4)</text>

  <!-- ===== 底部说明 ===== -->
  <text x="185" y="268" text-anchor="middle" fill="#6b7280" font-size="13">同一事件在不同惯性系：坐标全变，间隔 Δs² 不变</text>
</svg>
