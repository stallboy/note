<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：德沙格定理 —— 两三角形 ABC 与 A′B′C′ 关于视点 O 透视，
     三对对应顶点连线 AA′/BB′/CC′ 共点于 O，三对对应边交点共线（德沙格轴）。
     坐标按 TikZ 精确换算（C′ 微调至严格落在线 OC 上）；文字为真 <text>，清晰锐利。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 德沙格轴（示意位置：三对对应边交点所在的共线） -->
  <line x1="26" y1="595" x2="666" y2="515" stroke="#9aa7b8" stroke-width="1.8" stroke-dasharray="5 4"/>

  <!-- 三角形 ABC（原图） -->
  <polygon points="130,495 570,495 250,239" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 三角形 A′B′C′（透视下的像） -->
  <polygon points="230,275 462,297 294,138" fill="#fbdada" stroke="#8b2e2e" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 三条透视连线 OA / OB / OC（分别穿过 A′ / B′ / C′），置于填充之上以保持可见 -->
  <g stroke="#6b7280" stroke-width="2.2" fill="none">
    <line x1="130" y1="495" x2="330" y2="55"/>
    <line x1="570" y1="495" x2="330" y2="55"/>
    <line x1="250" y1="239" x2="330" y2="55"/>
  </g>

  <!-- 视点 O -->
  <circle cx="330" cy="55" r="3.8" fill="#6b7280"/>

  <!-- 点字母标签 -->
  <g fill="#374151" font-size="15">
    <text x="130" y="515" text-anchor="middle">A</text>
    <text x="570" y="515" text-anchor="middle">B</text>
    <text x="262" y="231" text-anchor="start">C</text>
    <text x="218" y="280" text-anchor="end">A′</text>
    <text x="474" y="302" text-anchor="start">B′</text>
    <text x="306" y="143" text-anchor="start">C′</text>
    <text x="330" y="43" text-anchor="middle">O</text>
  </g>

  <!-- 轴标签 -->
  <text x="674" y="519" text-anchor="start" fill="#6b7280" font-size="13">德沙格轴</text>
</svg>
