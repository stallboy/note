<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：正五边形黄金比（题5）。正五边形 ABCDE，中心 (200,200)，半径 100；
     A(200,100) B(105,169) C(141,281) D(259,281) E(295,169)。对角线 AC 与 BE 交于 P(178,169)；
     △ABP ∽ △ABE ⟹ AP=1/d；△BCP 等腰 ⟹ PC=1；d=1/d+1 ⟹ d=φ。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 360 320" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <!-- 正五边形 -->
  <polygon points="200,100 105,169 141,281 259,281 295,169" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- 对角线 AC, BE -->
  <line x1="200" y1="100" x2="141" y2="281" stroke="#9aa7b8" stroke-width="1.8"/>
  <line x1="105" y1="169" x2="295" y2="169" stroke="#9aa7b8" stroke-width="1.8"/>

  <!-- △ABP 高亮（红） -->
  <polygon points="200,100 105,169 178,169" fill="#f4d9d6" stroke="#c0463a" stroke-width="2" stroke-linejoin="round"/>

  <!-- 交点 P -->
  <circle cx="178" cy="169" r="4" fill="#c0463a"/>
  <text x="178" y="160" text-anchor="middle" fill="#c0463a" font-size="14" font-style="italic">P</text>

  <!-- 顶点 -->
  <text x="200" y="92" text-anchor="middle" fill="#1f3a5f" font-size="15" font-style="italic">A</text>
  <text x="96" y="166" text-anchor="end" fill="#1f3a5f" font-size="15" font-style="italic">B</text>
  <text x="133" y="296" text-anchor="end" fill="#1f3a5f" font-size="15" font-style="italic">C</text>
  <text x="267" y="296" fill="#1f3a5f" font-size="15" font-style="italic">D</text>
  <text x="304" y="166" fill="#1f3a5f" font-size="15" font-style="italic">E</text>

  <text x="200" y="312" text-anchor="middle" fill="#c0463a" font-size="13">△ABP ∽ △ABE ⟹ 对角线 d = (1+√5)/2 = φ</text>
</svg>
