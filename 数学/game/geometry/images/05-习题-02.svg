<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：完全四点形（题2）。A(80,240) B(360,240) C(140,80) D(320,300)；
     六条连线，对角点 P=AB∩CD（在 AB 上）。S=AB∩QR 把 AB 与 P 分成调和点列 (A,B;P,S)=-1。
     图为示意（Q,R 在视野外，用辅助标记表示 QR 方向）。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 440 320" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <!-- 六条连线（淡） -->
  <line x1="80"  y1="240" x2="360" y2="240" stroke="#1f3a5f" stroke-width="2.4"/>
  <line x1="140" y1="80"  x2="320" y2="300" stroke="#9aa7b8" stroke-width="1.8"/>
  <line x1="80"  y1="240" x2="140" y2="80"  stroke="#9aa7b8" stroke-width="1.8"/>
  <line x1="360" y1="240" x2="320" y2="300" stroke="#9aa7b8" stroke-width="1.8"/>
  <line x1="80"  y1="240" x2="320" y2="300" stroke="#9aa7b8" stroke-width="1.8"/>
  <line x1="360" y1="240" x2="140" y2="80"  stroke="#9aa7b8" stroke-width="1.8"/>

  <!-- P = AB ∩ CD（红，在 AB 上） -->
  <circle cx="252" cy="240" r="4.5" fill="#c0463a"/>
  <text x="252" y="262" text-anchor="middle" fill="#c0463a" font-size="15" font-style="italic">P</text>
  <!-- S = AB ∩ QR（红，示意在 AB 上 P 右侧） -->
  <circle cx="330" cy="240" r="4.5" fill="#c0463a"/>
  <text x="330" y="262" text-anchor="middle" fill="#c0463a" font-size="15" font-style="italic">S</text>

  <!-- 四顶点 -->
  <circle cx="80"  cy="240" r="4.5" fill="#1f3a5f"/>
  <text x="72" y="256" text-anchor="end" fill="#1f3a5f" font-size="16" font-style="italic">A</text>
  <circle cx="360" cy="240" r="4.5" fill="#1f3a5f"/>
  <text x="368" y="256" fill="#1f3a5f" font-size="16" font-style="italic">B</text>
  <circle cx="140" cy="80" r="4.5" fill="#1f3a5f"/>
  <text x="140" y="72" text-anchor="middle" fill="#1f3a5f" font-size="16" font-style="italic">C</text>
  <circle cx="320" cy="300" r="4.5" fill="#1f3a5f"/>
  <text x="328" y="298" fill="#1f3a5f" font-size="16" font-style="italic">D</text>

  <text x="220" y="300" text-anchor="middle" fill="#c0463a" font-size="13">(A, B ; P, S) = −1（调和点列）</text>
</svg>
