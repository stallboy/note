<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：费马点（题4），几何精确（数值验证）。
     ΔABC：A(120,90) B(400,150) C(180,360)；真实费马点 F(224.9,196)，三角皆 120°；
     外向正三角形顶点：C'(312,-122.5)（AB 边）、A'(471.9,445.5)（BC 边）、B'(-83.8,277)（CA 边）；
     F' = F 绕 A 转 60°（=264.2,52.2），C→F→F'→C' 恰好共线：折线被拉直成 CC'；
     AA'、BB'、CC' 共点于 F，且 AA'=BB'=CC'=FA+FB+FC≈500.2（均已数值验证）。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-110 -155 620 640" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 另两个外向正三角形（极淡示意） -->
  <polyline points="400,150 471.9,445.5 180,360" fill="none" stroke="#d3dae3" stroke-width="1.4" stroke-dasharray="4 4"/>
  <polyline points="180,360 -83.8,277 120,90" fill="none" stroke="#d3dae3" stroke-width="1.4" stroke-dasharray="4 4"/>
  <!-- 共点的三条连线 AA'、BB'（灰虚线，皆过 F） -->
  <line x1="120" y1="90" x2="471.9" y2="445.5" stroke="#9aa7b8" stroke-width="1.6" stroke-dasharray="6 4"/>
  <line x1="400" y1="150" x2="-83.8" y2="277" stroke="#9aa7b8" stroke-width="1.6" stroke-dasharray="6 4"/>

  <!-- ΔABC -->
  <polygon points="120,90 400,150 180,360" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- AB 边的外向正三角形 △ABC'（灰虚线） -->
  <polyline points="400,150 312,-122.5 120,90" fill="none" stroke="#9aa7b8" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round"/>

  <!-- F 处三条线 FA, FB, FC -->
  <line x1="224.9" y1="196" x2="120" y2="90" stroke="#1f3a5f" stroke-width="2"/>
  <line x1="224.9" y1="196" x2="400" y2="150" stroke="#1f3a5f" stroke-width="2"/>
  <line x1="224.9" y1="196" x2="180" y2="360" stroke="#1f3a5f" stroke-width="2"/>

  <!-- 折线 C→F→F'→C' 已被拉直（红，= CC' = FA+FB+FC） -->
  <polyline points="180,360 224.9,196 264.2,52.2 312,-122.5" fill="none" stroke="#c0463a" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- 等边 ΔAFF'（淡黄） -->
  <polygon points="120,90 224.9,196 264.2,52.2" fill="#fdf3d8" fill-opacity="0.75" stroke="#b58900" stroke-width="1.5" stroke-dasharray="4 3" stroke-linejoin="round"/>

  <!-- 旋转弧 B→C'（绕 A，60°） -->
  <path d="M400,150 A286.2,286.2 0 0 0 312,-122.5" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
  <text x="416" y="0" fill="#6b7280" font-size="13">旋转 60°</text>

  <!-- F 处三个 120° 弧 -->
  <path d="M206.4,177.4 A26,26 0 0 1 250,189.4" fill="none" stroke="#c0463a" stroke-width="1.6"/>
  <path d="M250,189.4 A26,26 0 0 1 218,221.1" fill="none" stroke="#c0463a" stroke-width="1.6"/>
  <path d="M218,221.1 A26,26 0 0 1 206.4,177.5" fill="none" stroke="#c0463a" stroke-width="1.6"/>
  <text x="237" y="152" fill="#c0463a" font-size="12">120°</text>
  <text x="258" y="232" fill="#c0463a" font-size="12">120°</text>
  <text x="150" y="212" fill="#c0463a" font-size="12">120°</text>

  <!-- 顶点与标签 -->
  <circle cx="120" cy="90" r="4.5" fill="#1f3a5f"/>
  <text x="108" y="84" text-anchor="end" fill="#1f3a5f" font-size="16" font-style="italic">A</text>
  <circle cx="400" cy="150" r="4.5" fill="#1f3a5f"/>
  <text x="412" y="146" fill="#1f3a5f" font-size="16" font-style="italic">B</text>
  <circle cx="180" cy="360" r="4.5" fill="#1f3a5f"/>
  <text x="168" y="378" text-anchor="end" fill="#1f3a5f" font-size="16" font-style="italic">C</text>
  <circle cx="224.9" cy="196" r="4.5" fill="#c0463a"/>
  <text x="215" y="188" text-anchor="end" fill="#c0463a" font-size="16" font-style="italic">F</text>
  <circle cx="312" cy="-122.5" r="4.5" fill="#6b7280"/>
  <text x="322" y="-128" fill="#6b7280" font-size="16">C′</text>
  <circle cx="264.2" cy="52.2" r="4" fill="#6b7280"/>
  <text x="275" y="49" fill="#6b7280" font-size="15">F′</text>
  <circle cx="471.9" cy="445.5" r="4" fill="#9aa7b8"/>
  <text x="482" y="452" fill="#6b7280" font-size="15">A′</text>
  <circle cx="-83.8" cy="277" r="4" fill="#9aa7b8"/>
  <text x="-92" y="281" text-anchor="end" fill="#6b7280" font-size="15">B′</text>

  <!-- 标注 -->
  <text x="285" y="24" fill="#c0463a" font-size="13">拉直成 CC′（= AA′ = BB′ = 最小值）</text>
  <text x="338" y="348" fill="#6b7280" font-size="12">AA′、BB′、CC′ 共点于 F</text>
</svg>
