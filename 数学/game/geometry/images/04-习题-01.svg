<?xml version="1.0" encoding="UTF-8"?>
<!-- 手写 SVG：椭圆内接最大三角形（题1）。椭圆中心(200,180)，半轴 a=150,b=100；
     圆内接正三角形(顶点 90°,210°,330°)经仿射 (x,y)→(ax,by) 得椭圆内接最大三角形：
     (200,80) (70,230) (330,230)。最大面积 = (3√3/4)·ab。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 380 320" text-rendering="geometricPrecision"
     font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">

  <!-- 椭圆 -->
  <ellipse cx="200" cy="180" rx="150" ry="100" fill="#dbe9fb" stroke="#1f3a5f" stroke-width="2.5"/>

  <!-- 内接最大三角形（红） -->
  <polygon points="200,80 70,230 330,230" fill="#f4d9d6" stroke="#c0463a" stroke-width="2.6" stroke-linejoin="round"/>

  <!-- 中心 -->
  <circle cx="200" cy="180" r="3" fill="#374151"/>

  <text x="200" y="60" text-anchor="middle" fill="#1f3a5f" font-size="13">椭圆 x²/a² + y²/b² = 1</text>
  <text x="200" y="280" text-anchor="middle" fill="#c0463a" font-size="13">最大面积 = (3√3 / 4)·ab</text>
  <text x="200" y="300" text-anchor="middle" fill="#6b7280" font-size="12">（圆内接正三角形的仿射像）</text>
</svg>
