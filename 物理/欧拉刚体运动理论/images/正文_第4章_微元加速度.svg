<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">转动刚体上一点的速度与加速度分解</title>
  <desc id="desc">点 P 绕轴心 O 沿虚线圆轨迹转动，角速度为 ω。速度 v 沿切线；加速度分解为沿切线的切向加速度与指向轴心的法向（向心）加速度，两者互相垂直，按灰色虚线平行四边形合成为总加速度 a。</desc>
  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#245b91"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c44536"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2e7d4f"/>
    </marker>
    <marker id="arrowN" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#999"/>
    </marker>
    <style>
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 20px; fill: #222; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 17px; fill: #444; }
      .point { fill: #c44536; }
      .velocity { stroke: #245b91; stroke-width: 3; fill: none; marker-end: url(#arrowB); }
      .accT { stroke: #2e7d4f; stroke-width: 3; marker-end: url(#arrowG); }
      .accN { stroke: #c44536; stroke-width: 3; marker-end: url(#arrowR); }
      .radius { stroke: #245b91; stroke-width: 2; }
      .result { stroke: #999; stroke-width: 2.5; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrowN); }
      .path { stroke: #999; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
    </style>
  </defs>

  <circle class="path" cx="280" cy="210" r="150"/>
  <text class="small" x="136" y="90">轨迹</text>

  <line class="radius" x1="280" y1="210" x2="398" y2="118"/>

  <circle cx="280" cy="210" r="9" fill="#fff" stroke="#245b91" stroke-width="2.5"/>
  <circle cx="280" cy="210" r="3" fill="#245b91"/>
  <text class="label" x="244" y="216">O</text>

  <path class="velocity" d="M251,244.5 A45,45 0 0 0 309,244.5"/>
  <text class="small" x="322" y="264">ω</text>

  <line class="path" x1="444" y1="177" x2="377" y2="229"/>
  <line class="path" x1="331" y1="170" x2="377" y2="229"/>

  <line class="result" x1="398" y1="118" x2="377" y2="229"/>

  <line class="velocity" x1="398" y1="118" x2="349" y2="55"/>
  <line class="accT" x1="398" y1="118" x2="444" y2="177"/>
  <line class="accN" x1="398" y1="118" x2="331" y2="170"/>

  <path d="M407,129 L396,138 L387,127" stroke="#999" stroke-width="1.5" fill="none"/>

  <circle class="point" cx="398" cy="118" r="6"/>

  <text class="small" x="410" y="106">P</text>
  <text class="small" x="326" y="46">v</text>
  <text class="small" x="296" y="216">ρ</text>
  <text class="small" x="456" y="186">a<tspan dy="5" font-size="13">t</tspan><tspan dy="-5"> = rα</tspan></text>
  <text class="small" x="222" y="166">a<tspan dy="5" font-size="13">n</tspan><tspan dy="-5"> = ω²ρ</tspan></text>
  <text class="small" x="391" y="243">a</text>

  <text class="label" x="170" y="388">切向分量 a<tspan dy="5" font-size="14">t</tspan><tspan dy="-5"> 改变转动快慢；法向分量（向心）a</tspan><tspan dy="5" font-size="14">n</tspan><tspan dy="-5"> 改变速度方向</tspan></text>
</svg>
