<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">天平动的偏差角</title>
  <desc id="desc">俯视图：椭球天体绕垂直纸面的第三主轴自转，第一主轴与惯性参考方向成自转角 θ；从质心 O 指向力心的单位矢 u 与参考方向成公转方向角 Λ；两方向之间为偏差角 φ=Λ−θ。右侧参考图：平衡位形中长轴正对力心，φ 在 0 附近小幅摆动。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#245b91"/>
    </marker>
    <marker id="arrowRev" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#245b91"/>
    </marker>
    <style>
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 20px; fill: #222; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 17px; fill: #444; }
      .body { fill: #dceaf5; stroke: #245b91; stroke-width: 3; }
      .point { fill: #c44536; }
      .vec { stroke: #245b91; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .axis { stroke: #245b91; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .path { stroke: #999; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
      .ang { stroke: #666; stroke-width: 1.8; fill: none; }
    </style>
  </defs>

  <line x1="672" y1="52" x2="672" y2="330" stroke="#ccc" stroke-width="1.5"/>

  <line class="path" x1="80" y1="252" x2="565" y2="252"/>
  <text class="small" x="82" y="280">惯性参考方向</text>

  <ellipse class="body" cx="295" cy="252" rx="130" ry="92" transform="rotate(-25 295 252)"/>

  <line class="axis" x1="170" y1="310" x2="431" y2="189"/>
  <text class="small" x="146" y="336">主轴 1</text>
  <line class="axis" x1="335" y1="338" x2="251" y2="157"/>
  <text class="small" x="240" y="146" text-anchor="end">主轴 2</text>

  <path class="ang" d="M 373 252 A 78 78 0 0 0 366 219"/>
  <text class="small" x="384" y="238">θ</text>
  <path class="ang" d="M 500 252 A 205 205 0 0 0 427 95"/>
  <text class="small" x="508" y="166">Λ</text>
  <path class="ang" d="M 422 193 A 140 140 0 0 0 385 145"/>
  <text class="small" x="417" y="160">φ</text>

  <path d="M 253.2 248.3 A 42 42 0 0 0 260.6 276.1" fill="none" stroke="#245b91" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="small" x="218" y="264" text-anchor="end">自转</text>

  <line class="vec" x1="295" y1="252" x2="436" y2="84"/>
  <text class="small" x="416" y="124">u</text>
  <circle cx="446" cy="72" r="13" fill="#dceaf5" stroke="#245b91" stroke-width="2.5"/>
  <text class="small" x="463" y="64">力心</text>

  <circle class="point" cx="295" cy="252" r="5.5"/>
  <circle cx="295" cy="252" r="10.5" fill="none" stroke="#245b91" stroke-width="1.8"/>
  <text class="label" x="263" y="240" text-anchor="end">O</text>
  <text class="small" x="305" y="296">主轴 3 ⊙</text>

  <text class="small" x="828" y="72" text-anchor="middle">参考：平衡位形</text>
  <line class="path" x1="700" y1="200" x2="934" y2="200"/>
  <ellipse class="body" cx="810" cy="200" rx="115" ry="68"/>
  <line x1="705" y1="200" x2="915" y2="200" stroke="#245b91" stroke-width="1.8"/>
  <text class="small" x="800" y="184" text-anchor="middle">长轴（小惯量轴）</text>
  <circle cx="948" cy="200" r="11" fill="#dceaf5" stroke="#245b91" stroke-width="2.5"/>
  <text class="small" x="948" y="172" text-anchor="middle">力心</text>
  <path d="M 927.8 177.1 A 120 120 0 0 1 927.8 222.9" fill="none" stroke="#245b91" stroke-width="2" marker-start="url(#arrowRev)" marker-end="url(#arrow)"/>
  <text class="small" x="897" y="204" text-anchor="middle">φ</text>
  <text class="small" x="810" y="290" text-anchor="middle">φ 在 0 附近小幅摆动</text>
  <text class="small" x="810" y="318" text-anchor="middle">平衡：长轴正对力心（φ = 0）</text>

  <text class="label" x="500" y="406" text-anchor="middle">偏差角 φ = Λ − θ：长轴指向与力心方向的错开量；平衡时 φ = 0，长轴正对力心</text>
</svg>
