<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
  <title id="title">进动与章动（第14章）</title>
  <desc id="desc">双联图。以过接触点的竖直虚线为极轴，画单位球。快陀螺 Ω₀ 大于临界转速 Ω_c：轴端轨迹在纬圈 φ=φ₀ 与下方纬圈 φ=φ_m 之间往复折返（章动），整体绕竖直方向前进（进动）。慢陀螺 Ω₀ 小于 Ω_c：倾角一路减小，到达水平位置 φ=0 后模型失效，陀螺倒下。φ 均为轴与水平面的夹角。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#245b91"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c44536"/>
    </marker>
    <style>
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 20px; fill: #222; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 17px; fill: #444; }
      .point { fill: #c44536; }
      .sphere { fill: #dceaf5; fill-opacity: 0.35; stroke: #245b91; stroke-opacity: 0.55; stroke-width: 2; }
      .guide { stroke: #999; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
      .trajF { stroke: #245b91; stroke-width: 3; fill: none; }
      .trajB { stroke: #245b91; stroke-width: 2.5; stroke-opacity: 0.4; fill: none; }
      .fall { stroke: #c44536; stroke-width: 3.5; marker-end: url(#arrowR); fill: none; }
      .leader { stroke: #999; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- ================= panel (a): fast top ================= -->
  <text class="label" x="280" y="44" text-anchor="middle">（a）快陀螺：Ω₀ &gt; Ω<tspan dy="5" font-size="14">c</tspan></text>
  <circle class="sphere" cx="280" cy="235" r="120"/>
  <line class="guide" x1="280" y1="95" x2="280" y2="385"/>
  <text class="small" x="288" y="108">竖直</text>

  <ellipse class="guide" cx="280" cy="161.1" rx="94.6" ry="28.4"/>
  <ellipse class="guide" cx="280" cy="197.9" rx="114.1" ry="34.2"/>
  <ellipse class="guide" cx="280" cy="235" rx="120" ry="36"/>
  <text class="small" x="178" y="166" text-anchor="end">纬圈 φ₀</text>
  <text class="small" x="158" y="202" text-anchor="end">纬圈 φ<tspan dy="5" font-size="13">m</tspan></text>
  <text class="small" x="152" y="240" text-anchor="end">φ=0（水平）</text>

