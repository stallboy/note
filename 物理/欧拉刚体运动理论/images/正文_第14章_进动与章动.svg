  <path class="trajF" d="M 368.9,170.8 L 370.0,172.8 L 371.0,174.9 L 371.7,177.1 L 372.2,179.6 L 372.3,182.1 L 372.2,184.8 L 371.8,187.6 L 370.9,190.4 L 369.7,193.4 L 368.1,196.3 L 366.1,199.3 L 363.6,202.3 L 360.8,205.2 L 357.6,208.0 L 354.1,210.7 L 350.4,213.3 L 346.4,215.8 L 342.3,218.1 L 338.1,220.2 L 334.0,222.2 L 330.0,223.9 L 326.1,225.4 L 322.5,226.8 L 319.3,227.9 L 316.4,228.9 L 314.0,229.6 L 312.1,230.2 L 310.7,230.7 L 309.8,230.9 L 309.5,231.0 L 309.5,231.0 L 309.1,228.7 L 308.0,226.5 L 306.4,224.4 L 304.3,222.3 L 301.6,220.2 L 298.5,218.2 L 295.0,216.2 L 291.1,214.3 L 286.8,212.4 L 282.3,210.4 L 277.6,208.5 L 272.7,206.6 L 267.8,204.7 L 262.9,202.8 L 258.0,200.9 L 253.3,199.0 L 248.7,197.2 L 244.4,195.4 L 240.4,193.6 L 236.7,192.0 L 233.3,190.4 L 230.3,188.9 L 227.7,187.6 L 225.4,186.4 L 223.5,185.3 L 221.9,184.4 L 220.7,183.8 L 219.9,183.3 L 219.4,183.0 L 219.2,182.9 L 219.2,182.9 L 218.2,184.8 L 216.7,186.8 L 215.0,188.6 L 212.8,190.3 L 210.4,191.8 L 207.6,193.3 L 204.6,194.6 L 201.3,195.7 L 198.0,196.7 L 194.6,197.5 L 191.1,198.1 L 187.7,198.6 L 184.5,198.9 L 181.4,199.0 L 178.6,199.1 L 176.1,199.0 L 173.8,198.8 L 171.9,198.5 L 170.3,198.1 L 169.0,197.7 L 168.1,197.3 L 167.3,196.9 L 166.8,196.5 L 166.5,196.1"/>
  <path class="trajF" marker-end="url(#arrow)" d="M 385.0,177.7 L 385.7,180.7 L 386.2,183.8 L 386.3,187.0 L 386.1,190.1 L 385.6,193.3 L 384.7,196.4 L 383.4,199.4 L 381.9,202.3 L 380.1,205.0 L 378.1,207.7 L 376.0,210.1 L 373.7,212.3 L 371.5,214.4 L 369.3,216.2 L 367.2,217.7 L 365.4,219.1 L 363.8,220.2 L 362.5,221.0 L 361.5,221.6 L 360.9,222.0 L 360.7,222.1 L 360.7,222.1 L 360.0,220.0 L 358.8,217.9 L 357.3,216.0 L 355.3,214.3 L 352.8,212.6 L 350.0,211.1 L 346.8,209.7 L 343.2,208.3 L 339.2,207.1 L 335.0,205.8 L 330.4,204.7 L 325.7,203.5 L 320.7,202.4 L 315.7,201.3 L 310.6,200.2 L 305.5,199.1 L 300.4,198.1 L 295.5,197.0 L 290.8,196.0 L 286.4,194.9 L 282.3,194.0 L 278.5,193.0 L 275.1,192.2 L 272.1,191.4 L 269.5,190.7 L 267.4,190.1 L 265.7,189.7 L 264.5,189.3 L 263.8,189.1 L 263.6,189.1 L 263.6,189.1 L 263.1,191.2 L 262.1,193.3 L 260.6,195.4 L 258.6,197.4 L 256.1,199.3 L 253.2,201.2 L 249.8,203.0 L 246.0,204.7 L 241.8,206.3 L 237.3,207.8"/>

  <circle class="point" cx="368.9" cy="170.8" r="5"/>
  <text class="small" x="305" y="158">t=0：φ=φ₀ 出发</text>
  <circle class="point" cx="219.2" cy="182.9" r="5"/>
  <text class="small" x="210" y="220">折返（φ₀）</text>
  <line class="leader" x1="233" y1="209" x2="222" y2="189"/>
  <circle class="point" cx="309.5" cy="231.0" r="4"/>
  <circle class="point" cx="360.7" cy="222.1" r="5"/>
  <text class="small" x="352" y="254" text-anchor="end">φ<tspan dy="5" font-size="13">m</tspan><tspan dy="-5" font-size="17">（最低）</tspan></text>
  <circle class="point" cx="263.6" cy="189.1" r="4"/>
  <text class="small" x="280" y="292" text-anchor="middle">进动（ψ 增大）</text>

  <text class="small" x="280" y="408" text-anchor="middle">章动：φ 在 φ₀ 与 φ<tspan dy="5" font-size="13">m</tspan><tspan dy="-5" font-size="17">间折返；进动：ψ 持续增大</tspan></text>

  <!-- ================= panel (b): slow top ================= -->
  <text class="label" x="810" y="44" text-anchor="middle">（b）慢陀螺：Ω₀ &lt; Ω<tspan dy="5" font-size="14">c</tspan></text>
  <circle class="sphere" cx="810" cy="235" r="120"/>
  <line class="guide" x1="810" y1="95" x2="810" y2="385"/>
  <text class="small" x="818" y="108">竖直</text>

  <ellipse class="guide" cx="810" cy="161.1" rx="94.6" ry="28.4"/>
  <ellipse class="guide" cx="810" cy="235" rx="120" ry="36"/>
  <text class="small" x="708" y="166" text-anchor="end">纬圈 φ₀</text>
  <text class="small" x="682" y="240" text-anchor="end">φ=0（水平）</text>

  <path class="trajF" d="M 882.4,179.4 L 882.3,179.5 L 881.9,180.0 L 881.3,180.8 L 880.4,181.9 L 879.2,183.3 L 877.6,185.0 L 875.8,187.0 L 873.5,189.3 L 870.8,191.8 L 867.8,194.6 L 864.3,197.5 L 860.4,200.6 L 856.2,203.9 L 851.5,207.4 L 846.6,210.9 L 841.4,214.6 L 836.1,218.3 L 830.7,222.1 L 825.2,226.0 L 819.9,229.8 L 814.7,233.8 L 809.9,237.7 L 805.3,241.7 L 801.3,245.7 L 797.7,249.8 L 794.7,253.9 L 792.3,258.0 L 790.6,262.1 L 789.5,266.3 L 789.2,270.5"/>
  <line class="fall" x1="789.2" y1="270.5" x2="773" y2="289"/>
  <circle class="point" cx="882.4" cy="179.4" r="5"/>
  <text class="small" x="912" y="176">t=0（初始 φ₀）</text>
  <text class="small" x="798" y="316" fill="#c44536">倒下</text>

  <text class="small" x="810" y="408" text-anchor="middle">倾角一路减小到 φ=0：轴到水平位置，单点接触模型失效</text>

  <text class="label" x="550" y="448" text-anchor="middle">倾角往复变化为章动，绕竖直方向前进为进动；临界转速 Ω<tspan dy="5" font-size="14">c</tspan><tspan dy="-5" font-size="20"> 把两种命运分开</tspan></text>
</svg>
