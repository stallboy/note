<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">偏心圆盘匀速旋转时的轴载</title>
  <desc id="desc">圆盘绕过盘心 O 的固定轴匀速旋转，质心 C 离轴距离为 d，沿灰色虚线圆转动。两个时刻 t₁、t₂ 的盘面一实一虚；从轴指向质心的离心载荷 Q=Mω²ρ_C 随盘一起转动、方向不断改变，支承对刚体的反力与它相反。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#245b91"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c44536"/>
    </marker>
    <style>
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 20px; fill: #222; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 17px; fill: #444; }
      .body { fill: #dceaf5; stroke: #245b91; stroke-width: 3; }
      .point { fill: #c44536; }
      .force { stroke: #c44536; stroke-width: 3; marker-end: url(#arrowRed); }
      .react { stroke: #c44536; stroke-width: 3; stroke-dasharray: 7 7; marker-end: url(#arrowRed); }
      .path { stroke: #999; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
      .spin { stroke: #245b91; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .sector { fill: #245b91; fill-opacity: 0.16; stroke: none; }
    </style>
  </defs>

  <circle class="body" cx="450" cy="192" r="128"/>
  <path class="sector" style="fill-opacity:0.18;stroke:#245b91;stroke-width:1.5;stroke-opacity:0.4" d="M450,192 L345.2,118.5 A128,128 0 0 0 326.4,225.1 Z"/>

  <g opacity="0.5">
    <circle class="body" cx="450" cy="192" r="128"/>
    <path class="sector" style="fill-opacity:0.35;stroke:#245b91;stroke-width:1.5;stroke-dasharray:5 5" d="M450,192 L554.8,118.5 A128,128 0 0 0 461.2,64.5 Z"/>
  </g>

  <circle class="path" cx="450" cy="192" r="75"/>
  <path class="spin" d="M335.4,182 A115 115 0 0 1 516,97.8"/>
  <text class="label" x="443" y="104">ω</text>

  <circle class="point" cx="376.1" cy="205" r="6"/>
  <circle class="point" cx="487.5" cy="127.1" r="6"/>

  <line class="force" x1="450" y1="192" x2="346.6" y2="210.3"/>
  <line class="force" x1="450" y1="192" x2="502.5" y2="101.1"/>
  <line class="react" x1="450" y1="192" x2="415" y2="252.6"/>

  <circle cx="450" cy="192" r="9" fill="#fff" stroke="#245b91" stroke-width="2.5"/>
  <circle cx="450" cy="192" r="3" fill="#245b91"/>
  <g stroke="#245b91" stroke-width="2">
    <line x1="462" y1="192" x2="468" y2="192"/>
    <line x1="458.5" y1="200.5" x2="462.7" y2="204.7"/>
    <line x1="450" y1="204" x2="450" y2="210"/>
    <line x1="441.5" y1="200.5" x2="437.3" y2="204.7"/>
    <line x1="438" y1="192" x2="432" y2="192"/>
    <line x1="441.5" y1="183.5" x2="437.3" y2="179.3"/>
    <line x1="450" y1="180" x2="450" y2="174"/>
    <line x1="458.5" y1="183.5" x2="462.7" y2="179.3"/>
  </g>
  <text class="label" x="428" y="178">O</text>

  <text class="small" x="404" y="213">d</text>
  <text class="small" x="275" y="238">C₁（t₁）</text>
  <text class="small" x="503" y="133">C₂（t₂）</text>
  <text class="small" x="188" y="170">Q = Mω²ρ<tspan dy="5" font-size="12">C</tspan></text>
  <text class="small" x="558" y="74">Q = Mω²ρ<tspan dy="5" font-size="12">C</tspan></text>
  <text class="small" x="300" y="300" text-anchor="middle">支承反力（与 Q 相反）</text>

  <text class="label" x="450" y="388" text-anchor="middle">质心绕轴旋转，离心载荷随之旋转：即使角速度不变，轴承也受不断转向的力</text>
</svg>
