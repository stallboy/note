<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">进动锥双联：随体观察与空间观察</title>
  <desc id="desc">左侧随体观察：角速度矢量位于锥面上，其矢端绕特殊主轴 ê₃ 匀速画小圆，绕行角速度 Ω_b，轴向分量 ω₃=ω·cosχ，横向分量 ω·sinχ。右侧空间观察：角动量 L 空间固定，特殊主轴 ê₃ 在半顶角 λ 的锥面上绕 L 进动（角速度 Ω_p）；ω 与 ê₃、L 共面，位于 L 的另一侧，ê₃ 与 ω 夹角 χ、ê₃ 与 L 夹角 λ。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#245b91"/>
    </marker>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c44536"/>
    </marker>
    <style>
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 20px; fill: #222; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 17px; fill: #444; }
      .point { fill: #c44536; }
      .vec { stroke: #245b91; stroke-width: 3; marker-end: url(#arrow); }
      .vecR { stroke: #c44536; stroke-width: 3.5; marker-end: url(#arrowR); }
      .path { stroke: #999; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
      .pathl { stroke: #999; stroke-width: 1.4; stroke-dasharray: 7 7; fill: none; }
      .arc { stroke: #999; stroke-width: 1.5; fill: none; }
      .cone { fill: #dceaf5; fill-opacity: 0.3; stroke: none; }
      .flow { stroke: #245b91; stroke-width: 4.5; fill: none; marker-end: url(#arrow); }
      .lead { stroke: #bbb; stroke-width: 1; stroke-dasharray: 2 3; fill: none; }
    </style>
  </defs>

  <!-- 左联：随体观察 -->
  <text class="label" x="70" y="44">随体观察</text>
  <text class="small" x="70" y="68">（参考系固连于刚体）</text>

  <path class="cone" d="M250,400 L130,160 A120,34 0 0,0 370,160 Z"/>
  <ellipse class="path" cx="250" cy="160" rx="120" ry="34"/>
  <line class="pathl" x1="250" y1="400" x2="130" y2="160"/>
  <line class="pathl" x1="250" y1="400" x2="370" y2="160"/>
  <line class="pathl" x1="250" y1="400" x2="158" y2="138"/>
  <line class="pathl" x1="250" y1="400" x2="342" y2="138"/>

  <line class="vec" x1="250" y1="400" x2="250" y2="95"/>
  <text class="label" x="262" y="96">ê₃</text>

  <ellipse class="path" cx="250" cy="232" rx="84" ry="24"/>
  <path class="flow" d="M329,240 A84,24 0 0,1 171,240"/>
  <text class="small" x="232" y="290">Ω<tspan font-size="13" dy="4">b</tspan></text>

  <line class="vec" x1="250" y1="400" x2="334" y2="232"/>
  <text class="label" x="344" y="242">ω</text>

  <line x1="250" y1="232" x2="320" y2="232" stroke="#245b91" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text class="small" x="256" y="222">ω sinχ</text>

  <text class="small" x="52" y="252">ω₃ = ω cosχ</text>
  <line class="lead" x1="162" y1="247" x2="243" y2="240"/>

  <path class="arc" d="M250,330 A70,70 0 0,1 281,337"/>
  <text class="small" x="262" y="321">χ</text>

  <circle class="point" cx="250" cy="400" r="5"/>
  <text class="small" x="266" y="408">质心</text>
  <text class="small" x="352" y="218">ω 矢端小圆（随体）</text>

  <!-- 分隔线 -->
  <line x1="552" y1="25" x2="552" y2="450" stroke="#ddd" stroke-width="1.5"/>

  <!-- 右联：空间观察 -->
  <text class="label" x="620" y="44">空间观察</text>
  <text class="small" x="620" y="68">（惯性参考系）</text>

  <path class="cone" d="M830,400 L725,155 A105,28 0 0,0 935,155 Z"/>
  <ellipse class="path" cx="830" cy="155" rx="105" ry="28"/>
  <line class="pathl" x1="830" y1="400" x2="725" y2="155"/>
  <line class="pathl" x1="830" y1="400" x2="882" y2="131"/>

  <line class="vecR" x1="830" y1="400" x2="830" y2="120"/>
  <text class="label" x="700" y="112">L</text>
  <text class="small" x="722" y="112">（空间固定）</text>

  <line class="vec" x1="830" y1="400" x2="935" y2="155"/>
  <text class="label" x="948" y="162">ê₃</text>

  <path class="flow" d="M929,165 A105,28 0 0,1 731,165"/>
  <text class="small" x="848" y="210">Ω<tspan font-size="13" dy="4">p</tspan></text>

  <line class="vec" x1="830" y1="400" x2="734" y2="285"/>
  <text class="label" x="710" y="282">ω</text>

  <path class="arc" d="M830,320 A80,80 0 0,1 861,327"/>
  <text class="small" x="845" y="315">λ</text>
  <path class="arc" d="M875,294 A115,115 0 0,0 756,312"/>
  <text class="small" x="803" y="270">χ</text>

  <circle class="point" cx="830" cy="400" r="5"/>
  <text class="small" x="848" y="412">质心（固定）</text>
  <text class="small" x="925" y="232">ê₃、ω、L 共面</text>

  <text class="label" x="130" y="468">体内看：转轴绕主轴匀速画小圆；空间看：主轴绕固定的角动量方向进动。三条轴一般不重合</text>
</svg>
