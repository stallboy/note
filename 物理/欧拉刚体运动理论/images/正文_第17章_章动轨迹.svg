  <line class="trajF" marker-end="url(#arrow)" x1="243.9" y1="160.4" x2="227" y2="170.5"/>

  <circle class="point" cx="250" cy="159.0" r="5"/>
  <text class="small halo" x="258" y="146">l<tspan dy="-9" font-size="12">•</tspan><tspan dy="9" font-size="17">=0</tspan></text>
  <circle class="point" cx="204.8" cy="178.4" r="4"/>

  <!-- ============ right: top view ============ -->
  <text class="label" x="715" y="62" text-anchor="middle">俯视：绕竖直轴的进动</text>

  <circle class="guide" cx="715" cy="250" r="68.9"/>
  <circle class="guide" cx="715" cy="250" r="90.3"/>
  <circle class="guide" cx="715" cy="250" r="110.2"/>

  <circle class="axisdot" cx="715" cy="250" r="8"/>
  <circle cx="715" cy="250" r="2.5" fill="#999"/>
  <text class="small" x="715" y="292" text-anchor="middle">竖直轴</text>

  <path class="trajF" marker-end="url(#arrow)" d="M 626.4,257.8 L 628.4,261.5 L 631.1,264.9 L 634.3,268.0 L 637.9,270.9 L 641.6,273.4 L 645.2,275.7 L 648.6,277.9 L 651.5,280.0 L 653.8,282.3 L 655.5,284.8 L 656.7,287.7 L 657.4,291.0 L 657.7,294.7 L 657.9,298.8 L 658.1,303.1 L 658.5,307.6 L 659.3,312.1 L 660.5,316.4 L 662.3,320.4 L 664.7,323.8 L 667.6,326.7 L 670.9,328.8 L 674.7,330.2 L 678.8,330.8 L 683.1,330.6 L 687.4,329.8 L 691.7,328.4 L 695.9,326.6 L 699.9,324.6 L 703.6,322.6 L 707.1,320.9 L 710.3,319.7 L 713.4,319.0 L 716.5,319.0 L 719.6,319.6 L 722.8,320.9 L 726.3,322.5 L 730.0,324.5 L 733.9,326.5 L 738.1,328.3 L 742.4,329.7 L 746.7,330.6 L 751.0,330.8 L 755.1,330.2 L 758.9,328.9 L 762.3,326.8 L 765.2,323.9 L 767.6,320.5 L 769.4,316.6 L 770.7,312.3 L 771.5,307.8 L 771.9,303.3 L 772.1,298.9 L 772.3,294.8 L 772.6,291.1 L 773.2,287.8 L 774.4,284.9 L 776.1,282.4 L 778.4,280.1 L 781.3,277.9 L 784.6,275.8 L 788.2,273.5 L 791.9,271.0 L 795.5,268.2 L 798.8,265.0 L 801.5,261.6 L 803.6,257.9 L 804.9,254.0 L 805.3,250.1 L 804.9,246.1 L 803.6,242.2 L 801.6,238.5 L 798.9,235.1 L 795.6,231.9 L 792.1,229.1 L 788.3,226.6 L 784.7,224.3 L 781.4,222.1 L 778.5,220.0 L 776.2,217.7 L 774.4,215.1 L 773.3,212.3 L 772.6,209.0 L 772.3,205.3 L 772.1,201.2 L 771.9,196.8 L 771.5,192.3 L 770.7,187.8 L 769.4,183.5 L 767.6,179.6 L 765.3,176.1 L 762.4,173.3 L 759.0,171.2 L 755.2,169.8 L 751.1,169.2 L 746.9,169.4 L 742.5,170.3 L 738.2,171.7 L 734.0,173.5 L 730.1,175.4 L 726.4,177.4 L 722.9,179.1 L 719.7,180.4 L 716.5,181.0 L 713.5,181.0 L 710.4,180.4 L 707.1,179.1 L 703.7,177.4 L 700.0,175.5 L 696.0,173.5 L 691.9,171.7 L 687.5,170.3 L 683.2,169.4 L 678.9,169.2 L 674.8,169.8 L 671.0,171.2 L 667.7,173.3 L 664.8,176.1 L 662.4,179.5 L 660.6,183.5 L 659.3,187.8 L 658.5,192.3 L 658.1,196.8 L 657.9,201.1 L 657.7,205.2 L 657.4,208.9 L 656.7,212.2 L 655.6,215.1 L 653.9,217.6 L 651.5,219.9 L 648.7,222.1 L 645.3,224.2 L 641.7,226.5 L 638.0,229.1 L 634.4,231.9 L 631.2,235.0 L 628.5,238.4 L 626.4,242.1 L 625.1,246.0 L 624.7,250.0"/>
  <text class="small" x="515" y="256" text-anchor="middle">绕行方向（进动）</text>

  <line class="leader" x1="836" y1="208" x2="784" y2="228"/>
  <text class="small" x="840" y="205">l₀（p₀=cos l₀）</text>
  <line class="leader" x1="814" y1="166" x2="786" y2="186"/>
  <text class="small" x="820" y="158">l<tspan dy="5" font-size="13">m</tspan><tspan dy="-5" font-size="17">（p</tspan><tspan dy="5" font-size="13">m</tspan><tspan dy="-5" font-size="17">=cos l</tspan><tspan dy="5" font-size="13">m</tspan><tspan dy="-5" font-size="17">）</tspan></text>
  <line class="leader" x1="774" y1="126" x2="768" y2="147"/>
  <text class="small" x="770" y="120">p=k：再低则边缘触地</text>

  <text class="small" x="715" y="400" text-anchor="middle">p 减小 = 陀螺下沉（l 增大）</text>

  <text class="label" x="500" y="428" text-anchor="middle">倾角在 l₀ 与 l<tspan dy="5" font-size="14">m</tspan><tspan dy="-5" font-size="20">之间往复（转向点处 l</tspan><tspan dy="-6" font-size="14">•</tspan><tspan dy="6" font-size="20">=0），同时绕竖直方向进动</tspan></text>
</svg>
