<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">章动轨迹（第17章）</title>
  <desc id="desc">单位球面两个视角。两条纬线对应初始倾角 l₀ 与最大倾角 l_m，p₀ = cos l₀ &gt; p_m = cos l_m：p 减小即陀螺下沉。快陀螺的轴端轨迹近似为均匀进动圆加微小皱纹，在两纬线之间往复，转向点处 l̇=0。更低的虚线纬线 p=k 是机身触地极限，再低则边缘触地。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#245b91"/>
    </marker>
    <style>
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 20px; fill: #222; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 17px; fill: #444; }
      .point { fill: #c44536; }
      .sphere { fill: #dceaf5; fill-opacity: 0.35; stroke: #245b91; stroke-opacity: 0.55; stroke-width: 2; }
      .guide { stroke: #999; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
      .trajF { stroke: #245b91; stroke-width: 3; fill: none; }
      .trajB { stroke: #245b91; stroke-width: 2.5; stroke-opacity: 0.4; fill: none; }
      .leader { stroke: #999; stroke-width: 1.5; fill: none; }
      .axisdot { stroke: #999; stroke-width: 2; fill: none; }
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- ============ left: front view ============ -->
  <text class="label" x="250" y="62" text-anchor="middle">正视：轴端轨迹</text>
  <text class="small" x="250" y="90" text-anchor="middle">波峰、波谷为转向点（l<tspan dy="-9" font-size="12">•</tspan><tspan dy="9" font-size="17">=0）</tspan></text>

  <circle class="sphere" cx="250" cy="250" r="130"/>
  <line class="guide" x1="250" y1="100" x2="250" y2="400"/>
  <text class="small" x="258" y="115">竖直</text>

  <ellipse class="guide" cx="250" cy="139.8" rx="68.9" ry="19.3"/>
  <ellipse class="guide" cx="250" cy="156.5" rx="90.3" ry="25.3"/>
  <ellipse class="guide" cx="250" cy="181.1" rx="110.2" ry="30.9"/>
  <text class="small" x="174" y="144" text-anchor="end">l₀</text>
  <text class="small" x="152" y="161" text-anchor="end">l<tspan dy="5" font-size="13">m</tspan></text>
  <text class="small" x="368" y="186">p=k（再低则触地）</text>

