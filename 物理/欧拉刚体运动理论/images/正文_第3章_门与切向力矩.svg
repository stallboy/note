<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">门的俯视图：力的分解与对轴力矩</title>
  <desc id="desc">俯视中的门绕过铰链 O、垂直纸面的 z 轴转动。把手处的斜向力 F 分解为沿门面的分量与垂直门面的分量：沿门面的分量作用线穿过轴，力矩为零；只有垂直门面的分量产生对轴力矩 τz = rFt。</desc>
  <defs>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c44536"/>
    </marker>
    <style>
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 20px; fill: #222; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 17px; fill: #444; }
      .body { fill: #dceaf5; stroke: #245b91; stroke-width: 3; }
      .point { fill: #c44536; }
      .force { stroke: #c44536; stroke-width: 3; marker-end: url(#arrowR); }
      .path { stroke: #999; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
      .action { stroke: #999; stroke-width: 2; stroke-dasharray: 16 9; fill: none; }
    </style>
  </defs>

  <text class="label" x="36" y="58">τ<tspan dy="5" font-size="14">z</tspan><tspan dy="-5"> = rF</tspan><tspan dy="5" font-size="14">t</tspan></text>
  <text class="small" x="36" y="88">俯视：转轴为过 O 的 z 轴，垂直纸面</text>

  <rect class="body" x="140" y="190" width="500" height="40"/>

  <line class="action" x1="25" y1="210" x2="875" y2="210"/>

  <circle cx="140" cy="210" r="10" fill="#fff" stroke="#245b91" stroke-width="2.5"/>
  <circle cx="140" cy="210" r="3" fill="#245b91"/>
  <text class="label" x="106" y="180">O</text>
  <text class="label" x="152" y="182">z</text>

  <line class="path" x1="490" y1="210" x2="490" y2="96"/>
  <line class="path" x1="610" y1="96" x2="490" y2="96"/>

  <line class="path" x1="140" y1="282" x2="610" y2="282"/>
  <line class="path" x1="140" y1="234" x2="140" y2="290"/>
  <line class="path" x1="610" y1="234" x2="610" y2="290"/>
  <text class="label" x="366" y="272">r</text>

  <line class="force" x1="610" y1="210" x2="610" y2="98"/>
  <line class="force" x1="610" y1="210" x2="494" y2="210"/>
  <line class="force" x1="610" y1="210" x2="494" y2="99"/>

  <circle class="point" cx="610" cy="210" r="6"/>

  <text class="small" x="622" y="140">F<tspan dy="5" font-size="13">t</tspan></text>
  <text class="small" x="530" y="182">F<tspan dy="5" font-size="13">r</tspan></text>
  <text class="small" x="450" y="84">F</text>
  <text class="small" x="620" y="264">把手（施力点）</text>
  <text class="small" x="655" y="200">F<tspan dy="5" font-size="13">r</tspan><tspan dy="-5"> 作用线过轴，力矩为零</tspan></text>

  <text class="label" x="100" y="388">只有垂直门面的分量 F<tspan dy="5" font-size="14">t</tspan><tspan dy="-5"> 对轴有力矩；沿门面的分量 F</tspan><tspan dy="5" font-size="14">r</tspan><tspan dy="-5"> 作用线过轴，推门不转</tspan></text>
</svg>
