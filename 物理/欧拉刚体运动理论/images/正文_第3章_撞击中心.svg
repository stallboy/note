<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="title desc">
  <title id="title">均质杆的撞击中心：轴反力为零的施力点</title>
  <desc id="desc">两幅并列图。均质杆绕过左端 O、垂直纸面的轴转动，质心 C 在 ℓ/2 处，撞击中心 H 在 2ℓ/3 处。垂直冲击击在 H 时轴的初始反力为零；击在杆端时轴产生与冲击同向的反力 R。</desc>
  <defs>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c44536"/>
    </marker>
    <style>
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 20px; fill: #222; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; font-size: 17px; fill: #444; }
      .body { fill: #dceaf5; stroke: #245b91; stroke-width: 3; }
      .point { fill: #c44536; }
      .force { stroke: #c44536; stroke-width: 3; marker-end: url(#arrowR); }
      .path { stroke: #999; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
      .tick { stroke: #999; stroke-width: 2; }
      .wall { stroke: #245b91; stroke-width: 3; }
      .hatch { stroke: #999; stroke-width: 2; }
    </style>
  </defs>

  <text class="label" x="60" y="52">（a）击在撞击中心 H（距轴 2ℓ/3 处）</text>

  <line class="wall" x1="100" y1="140" x2="100" y2="285"/>
  <line class="hatch" x1="100" y1="152" x2="86" y2="165"/>
  <line class="hatch" x1="100" y1="166" x2="86" y2="179"/>
  <line class="hatch" x1="100" y1="180" x2="86" y2="193"/>
  <line class="hatch" x1="100" y1="194" x2="86" y2="207"/>
  <line class="hatch" x1="100" y1="208" x2="86" y2="221"/>
  <line class="hatch" x1="100" y1="222" x2="86" y2="235"/>
  <line class="hatch" x1="100" y1="236" x2="86" y2="249"/>
  <line class="hatch" x1="100" y1="250" x2="86" y2="263"/>
  <line class="hatch" x1="100" y1="264" x2="86" y2="277"/>

  <rect class="body" x="100" y="197" width="380" height="26"/>
  <circle cx="100" cy="210" r="9" fill="#fff" stroke="#245b91" stroke-width="2.5"/>
  <circle cx="100" cy="210" r="3" fill="#245b91"/>
  <text class="label" x="114" y="191">O</text>

  <line class="force" x1="353" y1="88" x2="353" y2="190"/>
  <text class="small" x="363" y="128">V</text>

  <circle class="point" cx="290" cy="210" r="6"/>
  <text class="small" x="249" y="188">C（ℓ/2）</text>
  <circle class="point" cx="353" cy="210" r="6"/>
  <text class="small" x="346" y="256">H</text>
  <text class="small" x="114" y="254">R = 0</text>
  <text class="small" x="240" y="282">h = I<tspan dy="5" font-size="13">O</tspan><tspan dy="-5">/(Md) = 2ℓ/3</tspan></text>

  <line class="path" x1="100" y1="306" x2="480" y2="306"/>
  <line class="tick" x1="100" y1="292" x2="100" y2="314"/>
  <line class="tick" x1="290" y1="296" x2="290" y2="314"/>
  <line class="tick" x1="353" y1="296" x2="353" y2="314"/>
  <line class="tick" x1="480" y1="232" x2="480" y2="314"/>
  <text class="small" x="93" y="334">0</text>
  <text class="small" x="268" y="334">ℓ/2</text>
  <text class="small" x="331" y="334">2ℓ/3</text>
  <text class="small" x="473" y="334">ℓ</text>

  <text class="label" x="580" y="52">（b）击在杆端：轴产生反力 R</text>

  <line class="wall" x1="620" y1="140" x2="620" y2="285"/>
  <line class="hatch" x1="620" y1="152" x2="606" y2="165"/>
  <line class="hatch" x1="620" y1="166" x2="606" y2="179"/>
  <line class="hatch" x1="620" y1="180" x2="606" y2="193"/>
  <line class="hatch" x1="620" y1="194" x2="606" y2="207"/>
  <line class="hatch" x1="620" y1="208" x2="606" y2="221"/>
  <line class="hatch" x1="620" y1="222" x2="606" y2="235"/>
  <line class="hatch" x1="620" y1="236" x2="606" y2="249"/>
  <line class="hatch" x1="620" y1="250" x2="606" y2="263"/>
  <line class="hatch" x1="620" y1="264" x2="606" y2="277"/>

  <rect class="body" x="620" y="197" width="380" height="26"/>
  <circle cx="620" cy="210" r="9" fill="#fff" stroke="#245b91" stroke-width="2.5"/>
  <circle cx="620" cy="210" r="3" fill="#245b91"/>
  <text class="label" x="634" y="191">O</text>

  <line class="force" x1="1000" y1="88" x2="1000" y2="190"/>
  <text class="small" x="1010" y="128">V</text>

  <line class="force" x1="620" y1="228" x2="620" y2="280"/>
  <text class="small" x="634" y="270">R</text>

  <circle class="point" cx="810" cy="210" r="6"/>
  <text class="small" x="769" y="188">C（ℓ/2）</text>
  <circle class="point" cx="873" cy="210" r="6"/>
  <text class="small" x="840" y="256">H（2ℓ/3）</text>

  <line class="path" x1="620" y1="306" x2="1000" y2="306"/>
  <line class="tick" x1="620" y1="292" x2="620" y2="314"/>
  <line class="tick" x1="810" y1="296" x2="810" y2="314"/>
  <line class="tick" x1="873" y1="296" x2="873" y2="314"/>
  <line class="tick" x1="1000" y1="232" x2="1000" y2="314"/>
  <text class="small" x="613" y="334">0</text>
  <text class="small" x="788" y="334">ℓ/2</text>
  <text class="small" x="851" y="334">2ℓ/3</text>
  <text class="small" x="993" y="334">ℓ</text>

  <text class="label" x="290" y="368">击在撞击中心 H，轴的初始反力为零；击在杆端则有轴反力</text>
</svg>
