<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480">
  <style>.t{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#243447}.muted{fill:#64748b;font-size:17px}.label{font-size:20px}.title{font-size:23px;font-weight:700}.bar{stroke:#334155;stroke-width:2}</style>
  <rect width="1000" height="480" fill="#fbfdff"/>
  <text x="500" y="38" text-anchor="middle" class="t title">加权平均：总面积不变，把高低不同的矩形推平</text>
  <text x="260" y="85" text-anchor="middle" class="t label">Σ mi xi</text>
  <rect x="90" y="170" width="100" height="210" fill="#bfe0ff" class="bar"/>
  <rect x="190" y="100" width="160" height="280" fill="#d9f2e9" class="bar"/>
  <rect x="350" y="240" width="90" height="140" fill="#ffe4b5" class="bar"/>
  <text x="140" y="405" text-anchor="middle" class="t muted">m₁</text><text x="270" y="405" text-anchor="middle" class="t muted">m₂</text><text x="395" y="405" text-anchor="middle" class="t muted">m₃</text>
  <text x="75" y="180" text-anchor="end" class="t muted">x₁</text><text x="175" y="110" text-anchor="end" class="t muted">x₂</text><text x="335" y="250" text-anchor="end" class="t muted">x₃</text>
  <path d="M490 230 L580 230" stroke="#ef8354" stroke-width="4"/>
  <path d="M560 215 L585 230 L560 245" fill="none" stroke="#ef8354" stroke-width="4"/>
  <text x="745" y="85" text-anchor="middle" class="t label">M xC</text>
  <rect x="600" y="156" width="350" height="224" fill="#e8f2ff" class="bar"/>
  <line x1="580" y1="156" x2="970" y2="156" stroke="#ef8354" stroke-width="4"/>
  <text x="775" y="405" text-anchor="middle" class="t muted">M = m₁+m₂+m₃</text>
  <text x="775" y="136" text-anchor="middle" class="t label">xC</text>
  <text x="500" y="450" text-anchor="middle" class="t label">总面积 ÷ 总宽度 = 平均高度　⇒　xC = Σmixi / M</text>
</svg>