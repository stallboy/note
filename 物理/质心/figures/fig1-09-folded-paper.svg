  <path d="M412 115 Q380 75 338 115" stroke="#ef8354" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <text x="260" y="410" text-anchor="middle" class="t muted">右侧单位宽区域关于 x=3 翻折</text>
