<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510">
  <style>.t{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#243447}.shape{fill:#e8f2ff;stroke:#334155;stroke-width:3}.strip{stroke:#77aadd;stroke-width:2}.mid{stroke:#ef8354;stroke-width:4;stroke-dasharray:9 6}.muted{fill:#64748b;font-size:18px}.title{font-size:23px;font-weight:700}.label{font-size:20px}</style>
  <rect width="1000" height="510" fill="#fbfdff"/>
  <text x="500" y="38" text-anchor="middle" class="t title">平行切条：把重心约束到中位线上</text>
  <path d="M120 390 L360 390 L440 120 L200 120 Z" class="shape"/>
  <g class="strip"><line x1="133" y1="345" x2="373" y2="345"/><line x1="147" y1="300" x2="387" y2="300"/><line x1="160" y1="255" x2="400" y2="255"/><line x1="173" y1="210" x2="413" y2="210"/><line x1="187" y1="165" x2="427" y2="165"/></g>
  <line x1="240" y1="390" x2="320" y2="120" class="mid"/>
  <line x1="160" y1="255" x2="400" y2="255" stroke="#16a085" stroke-width="3" stroke-dasharray="7 5"/>
  <circle cx="280" cy="255" r="9" fill="#16a085"/>
  <text x="280" y="445" text-anchor="middle" class="t label">两组中位线交于同一中心</text>
  <path d="M690 100 L540 400 L880 400 Z" class="shape"/>
  <g class="strip"><line x1="573" y1="340" x2="847" y2="340"/><line x1="605" y1="280" x2="815" y2="280"/><line x1="638" y1="220" x2="782" y2="220"/><line x1="665" y1="170" x2="755" y2="170"/></g>
  <line x1="690" y1="100" x2="710" y2="400" class="mid"/>
  <g fill="#ef8354"><circle cx="700" cy="340" r="5"/><circle cx="704" cy="280" r="5"/><circle cx="707" cy="220" r="5"/><circle cx="709" cy="170" r="5"/></g>
  <circle cx="703" cy="300" r="9" fill="#16a085"/>
  <text x="690" y="72" text-anchor="middle" class="t label">A</text><text x="515" y="420" class="t label">B</text><text x="895" y="420" class="t label">C</text><text x="725" y="425" class="t label">D</text>
  <text x="710" y="465" text-anchor="middle" class="t label">细条中点串在中线 AD 上</text>
